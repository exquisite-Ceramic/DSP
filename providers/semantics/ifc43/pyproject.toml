[project]
name = "ifc43-semantic-provider"
version = "4.3.2.0"
description = "buildingSMART IFC4.3.2.0 reference Semantic Provider for DSP."
requires-python = ">=3.11"
dependencies = [
    "semantic-service>=0.1.0",
    "ifcopenshell==0.8.5",
]

# M1 将 Provider 对语义服务的第一方依赖显式绑定到 workspace member。
[tool.uv.sources]
semantic-service = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
