metadata:
  provider_id: dsp.enterprise.mapping
  provider_version: 1.0.0
  target_ifc_provider_id: buildingSMART.ifc43
  target_ifc_provider_version: 4.3.2.0
  target_ifc_schema: IFC4X3_ADD2

rules:
  - mapping_id: enterprise.autocad.layer.a-wall.exact.v1
    source_scheme: autocad.layer
    match:
      type: EXACT
      pattern: A-WALL
      case_sensitive: false
    target_term_id: ifc:IfcWall
    assurance: RULE_DERIVED

  - mapping_id: enterprise.autocad.layer.a-wall-prefix.v1
    source_scheme: autocad.layer
    match:
      type: PREFIX
      pattern: A-WALL-
      case_sensitive: false
    target_term_id: ifc:IfcWall
    assurance: RULE_DERIVED

  - mapping_id: enterprise.autocad.property.lwpolyline-constant-width.v1
    source_scheme: autocad.property
    match:
      type: EXACT
      pattern: LWPOLYLINE.ConstantWidth
      case_sensitive: true
    target_term_id: dsp:WallThickness
    assurance: RULE_DERIVED

  - mapping_id: enterprise.revit.builtin-category.ost-walls.v1
    source_scheme: revit.builtin_category
    match:
      type: EXACT
      pattern: OST_Walls
      case_sensitive: true
    target_term_id: ifc:IfcWall
    assurance: RULE_DERIVED

  - mapping_id: enterprise.revit.property.walltype-compound-structure-total-width.v1
    source_scheme: revit.property
    match:
      type: EXACT
      pattern: WallType.CompoundStructure.TotalWidth
      case_sensitive: true
    target_term_id: dsp:WallThickness
    assurance: RULE_DERIVED
