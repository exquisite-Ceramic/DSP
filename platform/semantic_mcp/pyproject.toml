[project]
name = "semantic-mcp"
version = "0.1.0"
description = "Thin MCP transport adapter for DSP Semantic Service."
requires-python = ">=3.11"
dependencies = [
    "semantic-service>=0.1.0",
    "mcp>=2,<3",
    "pydantic>=2,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
