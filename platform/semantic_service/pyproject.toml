[project]
name = "semantic-service"
version = "0.1.0"
description = "Provider-neutral semantic registry, routing, and environment pinning for DSP."
requires-python = ">=3.11"
dependencies = [
    "host-contracts>=0.1.0",
]

# M1 将已声明的第一方依赖显式绑定到 workspace member，避免依赖源码暴露或安装顺序。
[tool.uv.sources]
host-contracts = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
