version: 2

updates:
  # GitHub Actions：只跟踪仓库工作流，升级仍需通过现代化治理与回归门禁。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Python：根 uv workspace + committed lock 是唯一解析入口。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # NuGet：项目本地 PackageReference 继续保持所有权；递归发现仅生成候选 PR。
  - package-ecosystem: "nuget"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # .NET SDK：只从根 global.json 产生 SDK 更新候选，不隐式改变 Host TFM。
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
