version: 2

updates:
  # GitHub Actions：只跟踪仓库工作流，升级仍需通过现代化治理与回归门禁。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Python：根 uv workspace + committed lock 是唯一解析入口。
  # gRPC runtime、codegen 与 protobuf 必须作为一个兼容性 family 原子升级，避免 resolver 无解。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      python-grpc-build-stack:
        patterns:
          - "grpcio"
          - "grpcio-tools"
          - "protobuf"

  # NuGet：项目本地 PackageReference 继续保持所有权；递归发现仅生成候选 PR。
  # 测试基础设施依赖按一个逻辑栈分组，避免相同三项依赖在多个测试项目间重复生成碎片 PR。
  # gRPC transport 依赖也按一个兼容性 family 分组，避免 server、codegen、protobuf 与 test client 独立漂移。
  - package-ecosystem: "nuget"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      dotnet-test-stack:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit"
          - "xunit.runner.visualstudio"
      grpc-transport-stack:
        patterns:
          - "Google.Protobuf"
          - "Grpc.AspNetCore"
          - "Grpc.Tools"
          - "Grpc.Net.Client"

  # .NET SDK：只从根 global.json 产生 SDK 更新候选，不隐式改变 Host TFM。
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
