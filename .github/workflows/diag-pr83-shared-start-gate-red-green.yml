name: PR83 shared start-gate red-green proof

on:
  push:
    branches:
      - "diag/pr83-shared-start-gate-red-green-c67c7d7"

jobs:
  red-green:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dsp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DSP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/dsp_test
      OLD_HEAD: db4ef4a1cfe695ccd1a787b713fe2113f6099ee5
      FIXED_HEAD: c67c7d7475f79218b57f4322e001f85b4e6feee9
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install committed verification stack
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Prove regression is RED on old exact head
        run: |
          git checkout --detach "$OLD_HEAD"
          git show "$FIXED_HEAD:tests/product_runtime/test_product_task_shared_start_gate_postgres.py" \
            > tests/product_runtime/test_product_task_shared_start_gate_postgres.py
          set +e
          output="$(uv run python -m pytest \
            tests/product_runtime/test_product_task_shared_start_gate_postgres.py -q 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected old shared-connection implementation to fail the regression."
            exit 1
          fi
          printf '%s\n' "$output" | grep -F \
            "共享 PostgresProductTaskStartGate 允许第二个并发 submit"
      - name: Prove regression is GREEN on fixed exact head
        run: |
          git reset --hard
          git clean -fd
          git checkout --detach "$FIXED_HEAD"
          test "$(git rev-parse HEAD)" = "$FIXED_HEAD"
          uv run python -m pytest \
            tests/product_runtime/test_product_task_shared_start_gate_postgres.py -q
          uv run ruff check --select E,F,I \
            platform/product_runtime/src/design_product_runtime/postgres_start_gate.py \
            tests/product_runtime/test_product_task_shared_start_gate_postgres.py
