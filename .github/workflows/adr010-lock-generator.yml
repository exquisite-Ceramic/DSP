name: ADR-010 temporary uv lock generator

on:
  push:
    branches:
      - feat/adr-010-workflow-orchestrator-runtime
    paths:
      - pyproject.toml
      - platform/orchestrator/pyproject.toml
      - .github/workflows/adr010-lock-generator.yml

# 本 workflow 只服务于当前远程实现会话：用 uv 官方解析器生成 lock，并把生成结果
# 直接提交到当前 feature branch。Task 1 GREEN 前会删除本文件，因此它不是长期 CI owner。
permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the same uv generation used by repository CI
        run: python -m pip install uv==0.12.16
      - name: Resolve ADR-010 workspace lock
        run: |
          # 必须让 uv 从 package metadata 重新解析完整 workspace；禁止手工拼接 uv.lock。
          uv lock
          uv lock --check
      - name: Commit generated lock to the exact feature branch
        run: |
          # 只有 lock 真正变化时才提交；提交内容完全来自上一阶段的 uv 解析结果。
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches package metadata"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: lock workflow orchestrator runtime"
          git push origin HEAD:feat/adr-010-workflow-orchestrator-runtime
