name: Task 8 reference client RED afc675d0

on:
  push:
    branches:
      - diag/task8-reference-client-red-afc675d0

permissions:
  contents: read

jobs:
  verify-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: afc675d07f14ee395c13df386b79377d282501d3
          fetch-depth: 0

      - name: Assert exact RED head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "afc675d07f14ee395c13df386b79377d282501d3"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install committed verification stack
        shell: bash
        run: |
          python -m pip install uv
          uv sync --locked --all-packages

      - name: Run Task 8 focused RED
        shell: bash
        run: |
          uv run pytest \
            tests/product_front_door/test_mcp_client.py \
            tests/product_front_door/test_reference_client.py \
            -q -vv
