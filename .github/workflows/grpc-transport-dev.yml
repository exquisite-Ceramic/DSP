name: gRPC transport development verification

on:
  push:
    branches:
      - feat/grpc-loopback-transport
  workflow_dispatch:

jobs:
  transport-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install transport test dependencies
        run: python -m pip install pytest pytest-asyncio jsonschema 'grpcio>=1.70,<2' 'grpcio-tools==1.70.0' 'protobuf>=5.29,<7'
      - name: Regenerate Python transport stubs
        run: python tools/generate_host_transport.py
      - name: Verify generated stubs are up to date
        run: git diff --exit-code -- hosts/autocad/sidecar/src/autocad_sidecar/ipc/generated
      - name: Run transport Python tests
        run: >-
          pytest -q
          tests/contracts/test_transport_proto_shape.py
          tests/integration/test_grpc_transport.py
          tests/integration/test_transport_selector.py
          tests/integration/test_host_adapter_transport.py
      - name: Run contract regression tests
        run: pytest -q contracts/python/tests tests/contracts

  transport-dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run transport assembly tests
        run: dotnet test hosts/autocad/transport/dotnet/AutoCAD.AgentHost.Grpc.Tests/AutoCAD.AgentHost.Grpc.Tests.csproj --configuration Release

  transport-discovery-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Windows discovery tests
        run: pytest -q tests/integration/test_autocad_discovery.py
