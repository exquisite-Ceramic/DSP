name: gRPC transport development verification

on:
  push:
    branches:
      - feat/grpc-loopback-transport
  workflow_dispatch:

jobs:
  transport-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install transport test dependencies
        run: python -m pip install pytest 'grpcio>=1.70,<2' 'grpcio-tools==1.70.0' 'protobuf>=5.29,<7'
      - name: Regenerate Python transport stubs
        run: python tools/generate_host_transport.py
      - name: Verify generated stubs are up to date
        run: git diff --exit-code -- hosts/autocad/sidecar/src/autocad_sidecar/ipc/generated
      - name: Run transport proto shape test
        run: pytest -q tests/contracts/test_transport_proto_shape.py
