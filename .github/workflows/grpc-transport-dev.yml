name: gRPC transport development verification

on:
  push:
    branches:
      - feat/grpc-loopback-transport
  workflow_dispatch:

jobs:
  transport-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install transport test dependencies
        run: python -m pip install pytest 'grpcio>=1.70,<2' 'grpcio-tools==1.70.0' 'protobuf>=5.29,<7'
      - name: Generate Python transport stubs
        run: python tools/generate_host_transport.py
      - name: Run transport proto shape test
        run: pytest -q tests/contracts/test_transport_proto_shape.py
      - name: Upload generated transport stubs
        uses: actions/upload-artifact@v4
        with:
          name: generated-python-transport-stubs
          path: |
            hosts/autocad/sidecar/src/autocad_sidecar/ipc/generated/host_transport_v1_pb2.py
            hosts/autocad/sidecar/src/autocad_sidecar/ipc/generated/host_transport_v1_pb2_grpc.py
