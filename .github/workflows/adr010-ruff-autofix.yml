name: ADR-010 Ruff autofix

on:
  push:
    branches:
      - feat/adr-010-workflow-orchestrator-runtime
    paths:
      - ".github/workflows/adr010-ruff-autofix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/adr-010-workflow-orchestrator-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fix ADR-010 branch Ruff diagnostics
        shell: bash
        run: |
          python -m pip install ruff==0.16.8
          ruff check --select I001,F401 --fix \
            platform/orchestrator/src/design_orchestrator/default_workflow_services.py \
            tests/orchestrator/test_default_workflow_services.py \
            tests/orchestrator/test_langgraph_runtime.py \
            tests/orchestrator/test_postgres_checkpoint.py \
            tests/orchestrator/test_workflow_contracts.py \
            tests/orchestrator/test_workflow_end_to_end.py \
            tests/orchestrator/test_workflow_resume_authoritative_truth.py \
            tests/orchestrator/test_workflow_services.py
          ruff check --select I001,F401 \
            platform/orchestrator/src/design_orchestrator/default_workflow_services.py \
            tests/orchestrator/test_default_workflow_services.py \
            tests/orchestrator/test_langgraph_runtime.py \
            tests/orchestrator/test_postgres_checkpoint.py \
            tests/orchestrator/test_workflow_contracts.py \
            tests/orchestrator/test_workflow_end_to_end.py \
            tests/orchestrator/test_workflow_resume_authoritative_truth.py \
            tests/orchestrator/test_workflow_services.py
          rm .github/workflows/adr010-ruff-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            platform/orchestrator/src/design_orchestrator/default_workflow_services.py \
            tests/orchestrator/test_default_workflow_services.py \
            tests/orchestrator/test_langgraph_runtime.py \
            tests/orchestrator/test_postgres_checkpoint.py \
            tests/orchestrator/test_workflow_contracts.py \
            tests/orchestrator/test_workflow_end_to_end.py \
            tests/orchestrator/test_workflow_resume_authoritative_truth.py \
            tests/orchestrator/test_workflow_services.py \
            .github/workflows/adr010-ruff-autofix.yml
          git diff --cached --check
          git commit -m "style: clear ADR-010 Ruff diagnostics"
          git push origin HEAD:feat/adr-010-workflow-orchestrator-runtime
