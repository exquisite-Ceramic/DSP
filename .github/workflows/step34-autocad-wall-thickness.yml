name: Step34 AutoCAD wall thickness

on:
  push:
    paths:
      - ".github/workflows/step34-autocad-wall-thickness.yml"
      - "docs/superpowers/specs/2026-08-30-step34-autocad-wall-thickness-design.md"
      - "docs/superpowers/plans/2026-08-30-step34-autocad-wall-thickness.md"
      - "platform/orchestrator/**"
      - "hosts/autocad/sidecar/**"
      - "hosts/autocad/plugin/**"
      - "providers/semantics/enterprise_mapping/**"
      - "tests/orchestrator/test_step34_wall_thickness_action.py"
      - "tests/semantic_providers/enterprise_mapping/**"
      - "tests/integration/test_autocad_native_fact_command.py"
      - "tests/integration/test_design_capability_profile.py"
      - "tests/integration/test_step21_d5_canonical_projection.py"
      - "tests/integration/test_step34_autocad_wall_thickness_command.py"
      - "tests/integration/test_step34_autocad_wall_thickness_reconciliation.py"
  pull_request:
    paths:
      - ".github/workflows/step34-autocad-wall-thickness.yml"
      - "docs/superpowers/specs/2026-08-30-step34-autocad-wall-thickness-design.md"
      - "docs/superpowers/plans/2026-08-30-step34-autocad-wall-thickness.md"
      - "platform/orchestrator/**"
      - "hosts/autocad/sidecar/**"
      - "hosts/autocad/plugin/**"
      - "providers/semantics/enterprise_mapping/**"
      - "tests/orchestrator/test_step34_wall_thickness_action.py"
      - "tests/semantic_providers/enterprise_mapping/**"
      - "tests/integration/test_autocad_native_fact_command.py"
      - "tests/integration/test_design_capability_profile.py"
      - "tests/integration/test_step21_d5_canonical_projection.py"
      - "tests/integration/test_step34_autocad_wall_thickness_command.py"
      - "tests/integration/test_step34_autocad_wall_thickness_reconciliation.py"
  workflow_dispatch:

jobs:
  step34-offline-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Step34 verification stack
        run: |
          python -m pip install pytest pytest-asyncio jsonschema PyYAML==6.0.3 ruff
          python -m pip install \
            -e contracts/python \
            -e hosts/autocad/sidecar \
            -e platform/changeset \
            -e platform/execution_planning \
            -e platform/provider_binding \
            -e platform/semantic_runtime \
            -e platform/semantic_service \
            -e platform/semantic_mcp \
            -e providers/semantics/dsp_core \
            -e providers/semantics/ifc43 \
            -e providers/semantics/metro_v32 \
            -e providers/semantics/enterprise_mapping \
            -e platform/gateway_authorization \
            -e platform/execution_reconciliation
      - name: Run Step34 canonical action proof
        run: pytest -q tests/orchestrator/test_step34_wall_thickness_action.py
      - name: Run Step34 native fact normalization proof
        run: pytest -q tests/integration/test_autocad_native_fact_command.py
      - name: Run Step34 enterprise semantic projection proof
        run: |
          pytest -q tests/semantic_providers/enterprise_mapping
          pytest -q tests/integration/test_step21_d5_canonical_projection.py
      - name: Run Step34 sidecar command proof
        run: |
          pytest -q tests/integration/test_design_capability_profile.py
          pytest -q tests/integration/test_step34_autocad_wall_thickness_command.py
      - name: Run Step34 reconciliation proof
        run: |
          pytest -q tests/integration/test_step34_autocad_wall_thickness_reconciliation.py
          pytest -q tests/execution_reconciliation
      - name: Run Step34 Python lint
        run: |
          ruff check \
            hosts/autocad/sidecar/src/autocad_sidecar/adapter/design_fact_adapter.py \
            hosts/autocad/sidecar/src/autocad_sidecar/adapter/model_adapter.py \
            hosts/autocad/sidecar/src/autocad_sidecar/execution/command_dispatcher.py \
            hosts/autocad/sidecar/src/autocad_sidecar/mcp_server.py \
            platform/orchestrator/src/design_orchestrator/canonical_operations.py \
            platform/orchestrator/src/design_orchestrator/parameter_binder.py \
            providers/semantics/enterprise_mapping/src/enterprise_mapping_provider/projection.py \
            providers/semantics/enterprise_mapping/src/enterprise_mapping_provider/provider.py \
            tests/orchestrator/test_step34_wall_thickness_action.py \
            tests/semantic_providers/enterprise_mapping/test_step34_property_projection.py \
            tests/integration/test_step34_autocad_wall_thickness_command.py \
            tests/integration/test_step34_autocad_wall_thickness_reconciliation.py
      - name: Run full repository importlib regression
        run: pytest -q --import-mode=importlib
      - name: Verify Step34 diff whitespace
        run: |
          git diff --check
          git diff --check ced26cbc2e000342d4342516389b8179834d9aaf...HEAD
