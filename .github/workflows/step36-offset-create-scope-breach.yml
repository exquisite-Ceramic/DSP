name: Step36 OFFSET create scope breach

on:
  push:
    paths:
      - ".github/workflows/step36-offset-create-scope-breach.yml"
  workflow_dispatch:

jobs:
  step36-ruff-fix-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Capture exact import-order fixes
        run: |
          ruff check --select I --fix \
            tests/impact/test_step36_creation_intent.py \
            tests/integration/test_step36_architecture.py \
            tests/integration/test_step36_autocad_offset_command.py \
            tests/integration/test_step36_live_autocad_offset_create.py \
            tests/integration/test_step36_live_offset_scope_acceptance.py \
            tests/orchestrator/test_step36_offset_action.py
          echo '--- RUFF IMPORT PATCH ---'
          git diff -- \
            tests/impact/test_step36_creation_intent.py \
            tests/integration/test_step36_architecture.py \
            tests/integration/test_step36_autocad_offset_command.py \
            tests/integration/test_step36_live_autocad_offset_create.py \
            tests/integration/test_step36_live_offset_scope_acceptance.py \
            tests/orchestrator/test_step36_offset_action.py
      - name: Show Step36 overlong lines
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in (
              "platform/approval_scope/src/design_approval_scope/planner.py",
              "tests/integration/test_step36_live_autocad_offset_create.py",
          ):
              path = Path(filename)
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if len(line) > 100:
                      print(f"{filename}:{number}:{len(line)}:{line}")
          PY
