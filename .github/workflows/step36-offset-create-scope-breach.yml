name: Step36 OFFSET create scope breach

on:
  push:
    paths:
      - ".github/workflows/step36-offset-create-scope-breach.yml"
      - "pyproject.toml"
      - "docs/superpowers/specs/2026-08-31-step36-offset-create-scope-breach-design.md"
      - "docs/superpowers/plans/2026-08-31-step36-offset-create-scope-breach.md"
      - "contracts/python/**"
      - "platform/orchestrator/**"
      - "platform/impact/**"
      - "platform/approval_scope/**"
      - "platform/changeset/**"
      - "platform/execution_planning/**"
      - "platform/provider_binding/**"
      - "platform/gateway_authorization/**"
      - "platform/execution_reconciliation/**"
      - "hosts/autocad/sidecar/**"
      - "hosts/autocad/plugin/**"
      - "tests/orchestrator/**"
      - "tests/impact/**"
      - "tests/approval_scope/**"
      - "tests/changeset/**"
      - "tests/execution_planning/**"
      - "tests/provider_binding/**"
      - "tests/gateway_authorization/**"
      - "tests/execution_reconciliation/**"
      - "tests/integration/autocad_live_host.py"
      - "tests/integration/test_autocad_live_host.py"
      - "tests/integration/test_step36_*.py"
  pull_request:
    paths:
      - ".github/workflows/step36-offset-create-scope-breach.yml"
      - "pyproject.toml"
      - "docs/superpowers/specs/2026-08-31-step36-offset-create-scope-breach-design.md"
      - "docs/superpowers/plans/2026-08-31-step36-offset-create-scope-breach.md"
      - "contracts/python/**"
      - "platform/orchestrator/**"
      - "platform/impact/**"
      - "platform/approval_scope/**"
      - "platform/changeset/**"
      - "platform/execution_planning/**"
      - "platform/provider_binding/**"
      - "platform/gateway_authorization/**"
      - "platform/execution_reconciliation/**"
      - "hosts/autocad/sidecar/**"
      - "hosts/autocad/plugin/**"
      - "tests/orchestrator/**"
      - "tests/impact/**"
      - "tests/approval_scope/**"
      - "tests/changeset/**"
      - "tests/execution_planning/**"
      - "tests/provider_binding/**"
      - "tests/gateway_authorization/**"
      - "tests/execution_reconciliation/**"
      - "tests/integration/autocad_live_host.py"
      - "tests/integration/test_autocad_live_host.py"
      - "tests/integration/test_step36_*.py"
  workflow_dispatch:

jobs:
  step36-offline-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Step36 verification stack
        run: |
          python -m pip install pytest pytest-asyncio jsonschema PyYAML==6.0.3 ruff
          python -m pip install \
            -e contracts/python \
            -e hosts/autocad/sidecar \
            -e platform/changeset \
            -e platform/execution_planning \
            -e platform/provider_binding \
            -e platform/semantic_runtime \
            -e platform/semantic_service \
            -e platform/semantic_mcp \
            -e providers/semantics/dsp_core \
            -e providers/semantics/ifc43 \
            -e providers/semantics/metro_v32 \
            -e providers/semantics/enterprise_mapping \
            -e platform/gateway_authorization \
            -e platform/execution_reconciliation
      - name: Verify Step36 canonical and authority layers
        run: |
          python -m pytest tests/orchestrator -q
          python -m pytest tests/impact -q
          python -m pytest tests/approval_scope -q
          python -m pytest tests/changeset -q
          python -m pytest tests/execution_planning -q
      - name: Verify Step36 provider binding and gateway lineage
        run: |
          python -m pytest tests/provider_binding -q
          python -m pytest tests/gateway_authorization -q
      - name: Verify Step36 creation and architecture proofs
        run: |
          python -m pytest \
            tests/integration/test_step36_offset_creation_authority.py \
            tests/integration/test_step36_autocad_offset_command.py \
            tests/integration/test_step36_architecture.py \
            -q
      - name: Collect Step36 live proofs without AutoCAD
        run: |
          python -m pytest \
            tests/integration/test_step36_live_autocad_offset_create.py \
            tests/integration/test_step36_live_offset_scope_acceptance.py \
            -q
      - name: Verify Step33 reconciliation regressions
        run: python -m pytest tests/execution_reconciliation -q
      - name: Run full repository importlib regression
        run: python -m pytest --import-mode=importlib -q
      - name: Enforce no new Step36 Ruff diagnostics
        run: |
          git worktree add /tmp/dsp-main origin/main
          (
            cd /tmp/dsp-main
            ruff check --select E,F,I --output-format=json platform hosts/autocad/sidecar tests > /tmp/main-ruff.json || true
          )
          ruff check --select E,F,I --output-format=json platform hosts/autocad/sidecar tests > /tmp/head-ruff.json || true
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          def diagnostics(path: str) -> Counter[tuple[str, str, str]]:
              rows = json.loads(Path(path).read_text(encoding="utf-8"))
              result: Counter[tuple[str, str, str]] = Counter()
              for row in rows:
                  filename = str(row["filename"]).replace("\\", "/")
                  for marker in ("/platform/", "/hosts/", "/tests/"):
                      if marker in filename:
                          filename = marker.strip("/") + "/" + filename.split(marker, 1)[1]
                          break
                  result[(filename, row["code"], row["message"])] += 1
              return result

          main = diagnostics("/tmp/main-ruff.json")
          head = diagnostics("/tmp/head-ruff.json")
          added = head - main
          print(f"main diagnostics: {sum(main.values())}")
          print(f"head diagnostics: {sum(head.values())}")
          print(f"new diagnostics: {sum(added.values())}")
          for item, count in sorted(added.items()):
              print("NEW", count, item)
          if added:
              sys.exit(1)
          PY
      - name: Verify Step36 diff whitespace
        run: |
          git diff --check
          git diff --check origin/main...HEAD
      - name: Show Step36 branch boundary
        run: |
          git log --oneline origin/main..HEAD
          git diff --name-only origin/main...HEAD
