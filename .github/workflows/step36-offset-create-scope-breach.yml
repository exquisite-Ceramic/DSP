name: Step36 offset create scope verification

on:
  push:
    branches:
      - 'feat/step36-offset-create-scope-breach'
    paths:
      - 'platform/orchestrator/**'
      - 'tests/orchestrator/**'
      - '.github/workflows/step36-offset-create-scope-breach.yml'
  workflow_dispatch:

jobs:
  task1-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio jsonschema
      - name: Run Step36 Task1 RED/GREEN tests
        run: python -m pytest tests/orchestrator/test_step36_offset_action.py -q
