name: Step36 OFFSET create scope breach

on:
  push:
    paths:
      - ".github/workflows/step36-offset-create-scope-breach.yml"
  workflow_dispatch:

jobs:
  step36-import-order-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture exact Ruff import-order patch
        run: |
          python -m pip install ruff
          ruff check --select I --fix tests/orchestrator/test_step36_offset_action.py || true
          git diff -- tests/orchestrator/test_step36_offset_action.py
          exit 1
