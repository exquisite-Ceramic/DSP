name: Step36 offset create scope verification

on:
  push:
    branches:
      - 'feat/step36-offset-create-scope-breach'
    paths:
      - 'platform/orchestrator/**'
      - 'platform/impact/**'
      - 'platform/approval_scope/**'
      - 'platform/changeset/**'
      - 'tests/orchestrator/**'
      - 'tests/impact/**'
      - 'tests/approval_scope/**'
      - 'tests/changeset/**'
      - '.github/workflows/step36-offset-create-scope-breach.yml'
  workflow_dispatch:

jobs:
  step36-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install pytest pytest-asyncio jsonschema
          python -m pip install \
            -e contracts/python \
            -e hosts/autocad/sidecar \
            -e platform/changeset \
            -e platform/semantic_runtime
      - name: Run Step36 Task1 focused tests
        run: python -m pytest tests/orchestrator/test_step36_offset_action.py -q
      - name: Run orchestrator regression
        run: python -m pytest tests/orchestrator -q
      - name: Run Step36 Task2 focused tests
        run: python -m pytest tests/impact/test_step36_creation_intent.py -q
      - name: Run impact regression
        run: python -m pytest tests/impact -q
      - name: Run Step36 Task3 focused tests
        run: >-
          python -m pytest
          tests/approval_scope/test_step36_creation_scope.py
          tests/approval_scope/test_step36_creation_hashing.py
          -q
      - name: Run approval scope regression
        run: python -m pytest tests/approval_scope -q
      - name: Run Step36 Task4 focused tests
        run: >-
          python -m pytest
          tests/changeset/test_step36_creation_hashing.py
          tests/changeset/test_step36_creation_contracts.py
          -q
      - name: Run changeset regression
        run: python -m pytest tests/changeset -q
