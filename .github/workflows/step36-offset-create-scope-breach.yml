name: Step36 OFFSET create scope breach

on:
  push:
    paths:
      - ".github/workflows/step36-offset-create-scope-breach.yml"
  workflow_dispatch:

jobs:
  step36-ruff-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce exact Ruff gate and capture patch
        run: |
          python -m pip install ruff
          echo '--- EXACT ALL-PATH DIAGNOSTICS FOR TARGET ---'
          ruff check --select E,F,I --output-format=concise platform hosts/autocad/sidecar tests 2>&1 | grep 'test_step36_offset_action.py' || true
          echo '--- TARGETED ALL-SELECT CHECK ---'
          ruff check --select E,F,I tests/orchestrator/test_step36_offset_action.py || true
          echo '--- APPLY I FIX ---'
          ruff check --select E,F,I --fix tests/orchestrator/test_step36_offset_action.py || true
          git diff -- tests/orchestrator/test_step36_offset_action.py
          exit 1
