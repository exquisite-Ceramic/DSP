name: Task 6R.3 test build

on:
  push:
    branches:
      - work/task6r3-tests

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/task6r3-tests
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Add Task 6R.3 saver-backed proof tests
        run: |
          python .github/task6r3_build.py
          python -m py_compile \
            tests/orchestrator/test_langgraph_graph.py \
            tests/orchestrator/test_canonical_owner_ports.py
      - name: Install repository verification stack from committed lock
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run Task 6R.3 focused pytest
        run: |
          uv run pytest \
            tests/orchestrator/test_langgraph_graph.py \
            tests/orchestrator/test_canonical_owner_ports.py -q
      - name: Run Task 6R.3 focused Ruff
        continue-on-error: true
        run: |
          uv run ruff check \
            tests/orchestrator/test_langgraph_graph.py \
            tests/orchestrator/test_canonical_owner_ports.py
      - name: Commit verified Task 6R.3 tests
        run: |
          git config user.name "DSP Task6R3 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add \
            tests/orchestrator/test_langgraph_graph.py \
            tests/orchestrator/test_canonical_owner_ports.py
          if git diff --cached --quiet; then
            echo "Task 6R.3 tests already present"
            exit 0
          fi
          git commit -m "test: prove persisted freshness lineage recovery"
          git push origin HEAD:work/task6r3-tests
