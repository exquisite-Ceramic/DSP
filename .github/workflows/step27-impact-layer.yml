name: Step27 deterministic impact layer

on:
  push:
    paths:
      - "platform/impact/**"
      - "tests/impact/**"
      - "pyproject.toml"
      - "docs/superpowers/specs/2026-08-29-step27-impact-layer-design.md"
      - "docs/superpowers/plans/2026-08-29-step27-impact-layer.md"
      - ".github/workflows/step27-impact-layer.yml"
  pull_request:
    paths:
      - "platform/impact/**"
      - "tests/impact/**"
      - "pyproject.toml"
      - "docs/superpowers/specs/2026-08-29-step27-impact-layer-design.md"
      - "docs/superpowers/plans/2026-08-29-step27-impact-layer.md"
      - ".github/workflows/step27-impact-layer.yml"
  workflow_dispatch:

jobs:
  step27-impact-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Step27 verification stack
        run: |
          python -m pip install pytest pytest-asyncio jsonschema PyYAML==6.0.3
          python -m pip install \
            -e contracts/python \
            -e hosts/autocad/sidecar \
            -e platform/semantic_runtime \
            -e platform/semantic_service \
            -e platform/semantic_mcp \
            -e providers/semantics/dsp_core \
            -e providers/semantics/ifc43 \
            -e providers/semantics/metro_v32 \
            -e providers/semantics/enterprise_mapping
      - name: Verify Step27 PR diff boundary
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/step27-impact-layer'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/step27-impact-layer\.yml|docs/superpowers/(specs/2026-08-29-step27-impact-layer-design|plans/2026-08-29-step27-impact-layer)\.md|platform/impact/src/design_impact/(__init__|contracts|rules|analyzer)\.py|pyproject\.toml|tests/impact/test_step27_(contracts|architecture|analyzer|constraints|d6_integration)\.py)$' || true)"
          if [ -n "$bad" ]; then
            echo "Step27 changed files outside approved boundary:"
            printf '%s\n' "$bad"
            exit 1
          fi
      - name: Run Step27 contract tests
        run: pytest -q tests/impact/test_step27_contracts.py
      - name: Run Step27 architecture guards
        run: pytest -q tests/impact/test_step27_architecture.py
      - name: Run Step27 analyzer tests
        run: pytest -q tests/impact/test_step27_analyzer.py
      - name: Run Step27 constraint tests
        run: pytest -q tests/impact/test_step27_constraints.py
      - name: Run Step27 D6 integration tests
        run: pytest -q tests/impact/test_step27_d6_integration.py
      - name: Run Step25 parameter binder regression
        run: pytest -q tests/orchestrator/test_step25_parameter_binder.py tests/orchestrator/test_step25_architecture.py
      - name: Run Step26 interaction regressions
        run: pytest -q tests/orchestrator/test_step26_interactive_binding.py tests/interaction/test_step26_interaction_coordinator.py tests/interaction/test_step26_architecture.py
      - name: Run Step24 resolver regressions
        run: pytest -q tests/orchestrator/test_step24_semantic_eligibility.py tests/orchestrator/test_operation_resolver.py
      - name: Run D4 to D5 freshness bridge regression
        run: pytest -q tests/semantic_runtime/test_d4_freshness_integration.py
      - name: Run relevant full Python regression
        run: |
          pytest -q --import-mode=importlib \
            contracts/python/tests \
            tests/contracts \
            tests/integration \
            tests/orchestrator \
            tests/interaction \
            tests/impact \
            tests/semantic_runtime
