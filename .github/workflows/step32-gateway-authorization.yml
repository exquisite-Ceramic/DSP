name: Step32 gateway authorization

on:
  push:
    paths:
      - "platform/gateway_authorization/**"
      - "tests/gateway_authorization/**"
      - "platform/approval_scope/**"
      - "tests/approval_scope/**"
      - "platform/changeset/**"
      - "tests/changeset/**"
      - "platform/execution_planning/**"
      - "tests/execution_planning/**"
      - "platform/provider_binding/**"
      - "tests/provider_binding/**"
      - "docs/superpowers/specs/2026-08-30-step32-gateway-authorization-design.md"
      - "docs/superpowers/plans/2026-08-30-step32-gateway-authorization.md"
      - ".github/workflows/step32-gateway-authorization.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "platform/gateway_authorization/**"
      - "tests/gateway_authorization/**"
      - "platform/approval_scope/**"
      - "tests/approval_scope/**"
      - "platform/changeset/**"
      - "tests/changeset/**"
      - "platform/execution_planning/**"
      - "tests/execution_planning/**"
      - "platform/provider_binding/**"
      - "tests/provider_binding/**"
      - "docs/superpowers/specs/2026-08-30-step32-gateway-authorization-design.md"
      - "docs/superpowers/plans/2026-08-30-step32-gateway-authorization.md"
      - ".github/workflows/step32-gateway-authorization.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  step32-gateway-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Step32 verification stack
        run: |
          python -m pip install pytest ruff
          python -m pip install -e platform/changeset
          python -m pip install -e platform/gateway_authorization
      - name: Verify Step32 PR diff boundary
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/step32-gateway-authorization'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(platform/(gateway_authorization|approval_scope|changeset|execution_planning|provider_binding)/|tests/(gateway_authorization|approval_scope|changeset|execution_planning|provider_binding)/|docs/superpowers/(specs/2026-08-30-step32-gateway-authorization-design|plans/2026-08-30-step32-gateway-authorization)\.md|\.github/workflows/step32-gateway-authorization\.yml|pyproject\.toml)' || true)"
          if [ -n "$bad" ]; then
            echo "Step32 changed files outside approved boundary:"
            printf '%s\n' "$bad"
            exit 1
          fi
      - name: Run Step32 contract tests
        run: pytest -q tests/gateway_authorization/test_step32_contracts.py
      - name: Run Step32 hashing tests
        run: pytest -q tests/gateway_authorization/test_step32_hashing.py
      - name: Run Step32 approval service tests
        run: pytest -q tests/gateway_authorization/test_step32_approval_service.py
      - name: Run Step32 approval store tests
        run: pytest -q tests/gateway_authorization/test_step32_store_approval.py
      - name: Run Step32 grant service tests
        run: pytest -q tests/gateway_authorization/test_step32_grant_service.py
      - name: Run Step32 grant lineage tests
        run: pytest -q tests/gateway_authorization/test_step32_grant_lineage.py
      - name: Run Step32 admission and revocation tests
        run: pytest -q tests/gateway_authorization/test_step32_admission_and_revocation.py
      - name: Run Step28 approval-scope regressions
        run: pytest -q tests/approval_scope
      - name: Run Step29 changeset regressions
        run: pytest -q tests/changeset
      - name: Run Step30 execution-planning regressions
        run: pytest -q tests/execution_planning
      - name: Run Step31 provider-binding regressions
        run: pytest -q tests/provider_binding
      - name: Run Ruff on Step32 changes
        run: |
          ruff check platform/gateway_authorization/src/design_gateway_authorization
          ruff check tests/gateway_authorization
