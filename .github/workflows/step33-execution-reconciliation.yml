name: Step33 execution reconciliation

on:
  push:
    paths:
      - "platform/execution_reconciliation/**"
      - "tests/execution_reconciliation/**"
      - "platform/approval_scope/**"
      - "tests/approval_scope/**"
      - "platform/changeset/**"
      - "tests/changeset/**"
      - "platform/execution_planning/**"
      - "tests/execution_planning/**"
      - "platform/gateway_authorization/**"
      - "tests/gateway_authorization/**"
      - "docs/superpowers/specs/2026-08-30-step33-execution-reconciliation-design.md"
      - "docs/superpowers/specs/2026-08-30-step33-execution-reconciliation-refinements.md"
      - "docs/superpowers/plans/2026-08-30-step33-execution-reconciliation.md"
      - ".github/workflows/step33-execution-reconciliation.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "platform/execution_reconciliation/**"
      - "tests/execution_reconciliation/**"
      - "platform/approval_scope/**"
      - "tests/approval_scope/**"
      - "platform/changeset/**"
      - "tests/changeset/**"
      - "platform/execution_planning/**"
      - "tests/execution_planning/**"
      - "platform/gateway_authorization/**"
      - "tests/gateway_authorization/**"
      - "docs/superpowers/specs/2026-08-30-step33-execution-reconciliation-design.md"
      - "docs/superpowers/specs/2026-08-30-step33-execution-reconciliation-refinements.md"
      - "docs/superpowers/plans/2026-08-30-step33-execution-reconciliation.md"
      - ".github/workflows/step33-execution-reconciliation.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  step33-execution-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Step33 TDD verification stack
        run: |
          python -m pip install pytest pytest-asyncio jsonschema PyYAML==6.0.3 ruff
          python -m pip install \
            -e contracts/python \
            -e hosts/autocad/sidecar \
            -e platform/changeset \
            -e platform/execution_planning \
            -e platform/provider_binding \
            -e platform/semantic_runtime \
            -e platform/semantic_service \
            -e platform/semantic_mcp \
            -e providers/semantics/dsp_core \
            -e providers/semantics/ifc43 \
            -e providers/semantics/metro_v32 \
            -e providers/semantics/enterprise_mapping \
            -e platform/gateway_authorization \
            -e platform/execution_reconciliation
      - name: Run Step33 focused tests
        run: pytest -q tests/execution_reconciliation
      - name: Run Step28 approval-scope regressions
        run: pytest -q tests/approval_scope
      - name: Run Step29 ChangeSet integrity regression
        run: pytest -q tests/changeset/test_step29_integrity.py
      - name: Run Step30 execution-planning regressions
        run: pytest -q tests/execution_planning
      - name: Run Step32 admission and revocation regression
        run: pytest -q tests/gateway_authorization/test_step32_admission_and_revocation.py
      - name: Run Step33 focused Ruff
        run: |
          ruff check \
            platform/execution_reconciliation/src/design_execution_reconciliation \
            tests/execution_reconciliation