name: Step33 execution reconciliation

on:
  push:
    paths:
      - ".github/workflows/step33-execution-reconciliation.yml"
      - "docs/superpowers/specs/2026-08-30-step33-execution-reconciliation-design.md"
      - "docs/superpowers/plans/2026-08-30-step33-execution-reconciliation.md"
      - "platform/execution_reconciliation/**"
      - "tests/execution_reconciliation/**"
      - "platform/execution_planning/**"
      - "tests/execution_planning/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/step33-execution-reconciliation.yml"
      - "docs/superpowers/specs/2026-08-30-step33-execution-reconciliation-design.md"
      - "docs/superpowers/plans/2026-08-30-step33-execution-reconciliation.md"
      - "platform/execution_reconciliation/**"
      - "tests/execution_reconciliation/**"
      - "platform/execution_planning/**"
      - "tests/execution_planning/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  step33-execution-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce Step33 PR diff boundary
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/step33-execution-reconciliation'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/step33-paths.txt
          python - <<'PY'
          from pathlib import Path

          allowed_exact = {
              ".github/workflows/step33-execution-reconciliation.yml",
              "docs/superpowers/specs/2026-08-30-step33-execution-reconciliation-design.md",
              "docs/superpowers/plans/2026-08-30-step33-execution-reconciliation.md",
              "pyproject.toml",
          }
          allowed_prefixes = (
              "platform/execution_reconciliation/",
              "tests/execution_reconciliation/",
              "platform/execution_planning/",
              "tests/execution_planning/",
          )
          paths = tuple(
              line.strip()
              for line in Path("/tmp/step33-paths.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          )
          outside = tuple(
              path
              for path in paths
              if path not in allowed_exact
              and not any(path.startswith(prefix) for prefix in allowed_prefixes)
          )
          if outside:
              raise SystemExit(
                  "Step33 PR modifies paths outside the frozen boundary:\n"
                  + "\n".join(outside)
              )
          PY
      - name: Install Step33 verification stack
        run: |
          python -m pip install pytest pytest-asyncio jsonschema PyYAML==6.0.3 ruff
          python -m pip install \
            -e contracts/python \
            -e hosts/autocad/sidecar \
            -e platform/changeset \
            -e platform/execution_planning \
            -e platform/provider_binding \
            -e platform/semantic_runtime \
            -e platform/semantic_service \
            -e platform/semantic_mcp \
            -e providers/semantics/dsp_core \
            -e providers/semantics/ifc43 \
            -e providers/semantics/metro_v32 \
            -e providers/semantics/enterprise_mapping \
            -e platform/gateway_authorization \
            -e platform/execution_reconciliation
      - name: Run Step28 integrity proof
        run: pytest -q tests/approval_scope/test_step28_integrity.py
      - name: Run Step29 integrity proof
        run: pytest -q tests/changeset/test_step29_integrity.py
      - name: Run Step30 integrity proof
        run: pytest -q tests/execution_planning/test_step30_integrity.py
      - name: Run Step33 focused tests
        run: pytest -q tests/execution_reconciliation
      - name: Run Step28 regressions
        run: pytest -q tests/approval_scope
      - name: Run Step29 regressions
        run: pytest -q tests/changeset
      - name: Run Step30 regressions
        run: pytest -q tests/execution_planning
      - name: Run Step31 regressions
        run: pytest -q tests/provider_binding
      - name: Run Step32 regressions
        run: pytest -q tests/gateway_authorization
      - name: Run Step33 and Step30 Ruff
        run: |
          ruff check \
            platform/execution_planning/src/design_execution_planning \
            platform/execution_reconciliation/src/design_execution_reconciliation \
            tests/execution_planning \
            tests/execution_reconciliation
      - name: Run full repository importlib suite
        run: pytest -q --import-mode=importlib
