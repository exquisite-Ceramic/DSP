name: Task7 planning GREEN diagnostic v4

on:
  push:
    branches:
      - diag/task7-planning-green-v4

permissions:
  contents: write

jobs:
  focused-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diag/task7-planning-green-v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply minimal Task7 planning implementation
        env:
          REPLACEMENT_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          adapter = Path("platform/orchestrator/src/design_orchestrator/canonical_owner_ports.py")
          text = adapter.read_text(encoding="utf-8")
          start = text.index("    def plan_execution(\n")
          end = text.index("\n    def check_revision_barrier", start)
          replacement = base64.b64decode(os.environ["REPLACEMENT_B64"]).decode("utf-8")
          adapter.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          census = Path("docs/superpowers/reviews/2026-09-20-real-owner-e2e-workflow-census.md")
          census_text = census.read_text(encoding="utf-8")
          old = "`design_convergence:ConvergenceComparisonProfile`<br>`design_convergence:build_convergence_profile`"
          new = "`design_convergence:ConvergenceComparisonProfile`<br>`design_convergence:ConvergenceProfileBuildRequest`<br>`design_convergence:build_convergence_profile`"
          if old not in census_text:
              raise SystemExit("convergence census marker not found")
          census.write_text(census_text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install repository verification stack from committed lock
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run focused Task7 planning GREEN
        run: uv run python -m pytest tests/orchestrator/test_task7_planning.py -q
      - name: Run real-owner architecture guard
        run: uv run python -m pytest tests/architecture/test_real_owner_workflow_boundaries.py tests/architecture/test_canonical_v2_boundaries.py -q
      - name: Run focused Ruff
        run: uv run ruff check platform/orchestrator/src/design_orchestrator/canonical_owner_ports.py tests/orchestrator/test_task7_planning.py tests/architecture/test_real_owner_workflow_boundaries.py
      - name: Commit verified planning GREEN without diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diag-task7-planning-green-v4.yml
          git add platform/orchestrator/src/design_orchestrator/canonical_owner_ports.py docs/superpowers/reviews/2026-09-20-real-owner-e2e-workflow-census.md tests/orchestrator/test_task7_planning.py
          git commit -m "feat: wire real Task7 planning owners"
          git push origin HEAD:diag/task7-planning-green-v4
