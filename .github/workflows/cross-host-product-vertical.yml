name: Cross-Host Product Vertical

on:
  push:
    paths:
      - ".github/workflows/cross-host-product-vertical.yml"
      - "tests/integration/test_cross_host_product_vertical_live.py"
      - "tests/integration/test_cross_host_product_live_preflight.py"
      - "tests/integration/test_cross_host_product_v2_proposal_authority.py"
      - "tests/integration/cross_host_product_v2_proposal_authority.py"
      - "tests/integration/cross_host_product_live_support.py"
      - "docs/runbooks/cross-host-product-vertical.md"
      - "platform/product_runtime/**"
      - "platform/product_front_door/**"
      - "hosts/autocad/**"
      - "hosts/revit/**"
  pull_request:
    paths:
      - ".github/workflows/cross-host-product-vertical.yml"
      - "tests/integration/test_cross_host_product_vertical_live.py"
      - "tests/integration/test_cross_host_product_live_preflight.py"
      - "tests/integration/test_cross_host_product_v2_proposal_authority.py"
      - "tests/integration/cross_host_product_v2_proposal_authority.py"
      - "tests/integration/cross_host_product_live_support.py"
      - "docs/runbooks/cross-host-product-vertical.md"
      - "platform/product_runtime/**"
      - "platform/product_front_door/**"
      - "hosts/autocad/**"
      - "hosts/revit/**"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Run one restored controlled dual-Host case"
        required: true
        type: choice
        options:
          - deny
          - unavailable
          - positive
          - partial_commit

jobs:
  cross-host-product-offline:
    runs-on: ubuntu-latest
    env:
      DSP_CROSS_HOST_PRODUCT_LIVE: "0"
      DSP_REVIT_LIVE: "0"
      DSP_PHASE_I_LIVE: "0"
      AGENT_HOST_TEST: "0"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dsp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Restore dependencies
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Collect and offline-verify live contract
        run: |
          uv run python -m pytest tests/integration/test_cross_host_product_vertical_live.py --collect-only -q
          uv run python -m pytest tests/integration/test_cross_host_product_vertical_live.py tests/integration/test_cross_host_product_live_preflight.py tests/integration/test_cross_host_product_v2_proposal_authority.py -q -vv
      - name: Task 15 full PostgreSQL matrix
        env:
          DSP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/dsp_test
        run: |
          uv run python -m pytest tests/product_runtime/test_cross_host_product_e2e.py tests/product_runtime/test_cross_host_product_stale.py tests/product_runtime/test_cross_host_product_authorization.py tests/product_runtime/test_cross_host_product_recovery.py tests/product_runtime/test_cross_host_product_query.py tests/product_runtime/test_cross_host_product_start.py tests/product_runtime/test_cross_host_observation.py -q -vv
      - name: AutoCAD Revit sidecar and Revit Core regressions
        run: |
          uv run python -m pytest hosts/autocad/sidecar/tests hosts/revit/sidecar/tests -q
          dotnet test hosts/revit/plugin/Revit.AgentHost.Core.Tests/Revit.AgentHost.Core.Tests.csproj -f net8.0
      - name: Absolute Ruff clean on new live and product paths
        run: |
          uv run ruff check --select E,F,I tests/integration/test_cross_host_product_vertical_live.py tests/integration/test_cross_host_product_live_preflight.py tests/integration/cross_host_product_live_support.py tests/integration/cross_host_product_v2_proposal_authority.py tests/integration/test_cross_host_product_v2_proposal_authority.py platform/product_runtime tests/product_runtime

  cross-host-product-real:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on:
      - self-hosted
      - Windows
      - dsp-cross-host-product
    env:
      DSP_CROSS_HOST_PRODUCT_LIVE: "1"
      DSP_CROSS_HOST_PRODUCT_EVIDENCE_DIR: artifacts/cross-host-product-live
      DSP_REVIT_LIVE: "0"
      DSP_PHASE_I_LIVE: "0"
      DSP_TEST_POSTGRES_DSN: ${{ secrets.DSP_TEST_POSTGRES_DSN }}
      DSP_AUTOCAD_ENDPOINT: ${{ vars.DSP_AUTOCAD_ENDPOINT }}
      DSP_AUTOCAD_DOCUMENT_REF: ${{ vars.DSP_AUTOCAD_DOCUMENT_REF }}
      DSP_AUTOCAD_FIXTURE_PATH: ${{ vars.DSP_AUTOCAD_FIXTURE_PATH }}
      DSP_AUTOCAD_FIXTURE_SHA256: ${{ vars.DSP_AUTOCAD_FIXTURE_SHA256 }}
      DSP_AUTOCAD_NATIVE_ID: ${{ vars.DSP_AUTOCAD_NATIVE_ID }}
      DSP_AUTOCAD_HOST_INSTANCE_ID: ${{ vars.DSP_AUTOCAD_HOST_INSTANCE_ID }}
      DSP_REVIT_LIVE_PIPE: ${{ vars.DSP_REVIT_LIVE_PIPE }}
      DSP_REVIT_LIVE_DOCUMENT_REF: ${{ vars.DSP_REVIT_LIVE_DOCUMENT_REF }}
      DSP_REVIT_LIVE_FIXTURE_PATH: ${{ vars.DSP_REVIT_LIVE_FIXTURE_PATH }}
      DSP_REVIT_LIVE_FIXTURE_SHA256: ${{ vars.DSP_REVIT_LIVE_FIXTURE_SHA256 }}
      DSP_REVIT_LIVE_WALL_UNIQUE_ID: ${{ vars.DSP_REVIT_LIVE_WALL_UNIQUE_ID }}
      DSP_REVIT_LIVE_HOST_INSTANCE_ID: ${{ vars.DSP_REVIT_LIVE_HOST_INSTANCE_ID }}
      DSP_AGENT_INTERPRETER_COMMAND_JSON: ${{ vars.DSP_AGENT_INTERPRETER_COMMAND_JSON }}
      DSP_AGENT_MODEL_NAME: ${{ vars.DSP_AGENT_MODEL_NAME }}
      DSP_CROSS_HOST_PRODUCT_MCP_URL: ${{ vars.DSP_CROSS_HOST_PRODUCT_MCP_URL }}
      DSP_AUTOCAD_BUILD_IDENTITY: ${{ vars.DSP_AUTOCAD_BUILD_IDENTITY }}
      DSP_REVIT_BUILD_IDENTITY: ${{ vars.DSP_REVIT_BUILD_IDENTITY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Restore committed stack
        shell: pwsh
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Verify both reviewed fixture SHA-256 values
        shell: pwsh
        run: |
          foreach ($pair in @(
            @($env:DSP_AUTOCAD_FIXTURE_PATH, $env:DSP_AUTOCAD_FIXTURE_SHA256),
            @($env:DSP_REVIT_LIVE_FIXTURE_PATH, $env:DSP_REVIT_LIVE_FIXTURE_SHA256)
          )) {
            if (-not (Test-Path -LiteralPath $pair[0])) { throw "Fixture missing" }
            $hash = (Get-FileHash -LiteralPath $pair[0] -Algorithm SHA256).Hash
            if ($hash -ne $pair[1]) { throw "Fixture hash mismatch" }
          }
      - name: Read-only production MCP PostgreSQL dual-Host preflight
        shell: pwsh
        run: |
          uv run python -m tests.integration.cross_host_product_live_support --preflight
      - name: Run one explicitly selected real model MCP Host case
        shell: pwsh
        run: |
          $env:DSP_CROSS_HOST_PRODUCT_SCENARIO = "${{ inputs.scenario }}"
          switch ($env:DSP_CROSS_HOST_PRODUCT_SCENARIO) {
            "deny" { $pattern = "live_case_policy_deny" }
            "unavailable" { $pattern = "live_case_required_host_unavailable" }
            "positive" { $pattern = "live_case_positive" }
            "partial_commit" { $pattern = "live_case_partial_commit" }
            default { throw "Unsupported controlled live scenario" }
          }
          uv run python -m pytest tests/integration/test_cross_host_product_vertical_live.py -k $pattern -q -vv -s
      - name: Archive controlled live evidence manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-host-product-${{ inputs.scenario }}-${{ github.sha }}
          path: artifacts/cross-host-product-live
          if-no-files-found: error
          retention-days: 30
