name: Task7 Step23 compatibility fix v2

on:
  push:
    branches:
      - diag/task7-planning-step23-fix-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: "github.event.head_commit.message != 'test: advance Task7 fail-closed boundary'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diag/task7-planning-step23-fix-v2
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Patch obsolete fail-closed assertion
        env:
          OLD_BLOCK_B64: 
          NEW_BLOCK_B64: 
        run: |
          python -c 'import base64, os, pathlib; p=pathlib.Path("tests/orchestrator/test_canonical_owner_ports.py"); s=p.read_text(); old=base64.b64decode(os.environ["OLD_BLOCK_B64"]).decode(); new=base64.b64decode(os.environ["NEW_BLOCK_B64"]).decode(); assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
      - name: Install locked workspace
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run focused owner-port regression
        run: uv run python -m pytest -q tests/orchestrator/test_canonical_owner_ports.py
      - name: Run focused Ruff
        run: uv run ruff check tests/orchestrator/test_canonical_owner_ports.py --ignore TRY004
      - name: Commit verified test migration
        run: |
          git config user.name FangBin
          git config user.email 52097203+exquisite-Ceramic@users.noreply.github.com
          git add tests/orchestrator/test_canonical_owner_ports.py
          git commit -m 'test: advance Task7 fail-closed boundary'
          git push origin HEAD:diag/task7-planning-step23-fix-v2
