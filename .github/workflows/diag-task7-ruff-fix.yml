name: Task 7 absolute Ruff fix

on:
  push:
    branches:
      - diag/task7-ruff-fix-2be3c46f

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tdd/mcp-agent-front-door-20260928
          fetch-depth: 0
      - name: Assert exact feature head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "2be3c46fd1251d3fa0493d11edd0a967e0e4aa9b"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install committed verification stack
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Apply mechanical Ruff fixes
        shell: bash
        run: |
          uv run ruff check \
            platform/product_front_door/src/design_product_front_door \
            tests/product_front_door \
            --fix --unsafe-fixes || true

          uv run python - <<'PY'
          from pathlib import Path

          path = Path("platform/product_front_door/src/design_product_front_door/service.py")
          text = path.read_text(encoding="utf-8")

          replacements = {
              '        if not isinstance(binding, SessionBinding):\n            raise ValueError(\n':
              '        if not isinstance(binding, SessionBinding):\n            # 保留既有 Front Door authority-value 错误契约；adapter 返回错类型也按无效 authority 处理。\n            raise ValueError(  # noqa: TRY004\n',
              '        if not isinstance(candidate, ConfiguredRevitCandidate):\n            raise ValueError(\n':
              '        if not isinstance(candidate, ConfiguredRevitCandidate):\n            # 保留既有 Front Door authority-value 错误契约；candidate source 错类型不改变公开异常族。\n            raise ValueError(  # noqa: TRY004\n',
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one exact service.py match, got {text.count(old)}: {old!r}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify absolute Product Front Door Ruff
        run: |
          uv run ruff check \
            platform/product_front_door/src/design_product_front_door \
            tests/product_front_door
      - name: Verify all Product Front Door tests
        run: uv run pytest tests/product_front_door -q
      - name: Commit verified static fixes to feature branch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/product_front_door/src/design_product_front_door tests/product_front_door
          test -n "$(git status --porcelain)"
          git commit -m "style: satisfy Task 7 Front Door absolute Ruff"
          git push origin HEAD:tdd/mcp-agent-front-door-20260928
