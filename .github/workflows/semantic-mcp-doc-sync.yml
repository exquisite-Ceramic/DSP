name: Semantic MCP one-time doc sync

on:
  push:
    branches:
      - 'feat/semantic-mcp-adapter'
    paths:
      - '.github/workflows/semantic-mcp-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch approved Semantic MCP documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          spec_path = Path('docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md')
          spec = spec_path.read_text()
          replacement = '''## 10.3 SemanticService Contract

平台内部逻辑接口建议至少包含：

```python
resolve_term(term_id, environment_id)
describe_term(term_id, environment_id, locale=None)
get_term_schema(term_id, environment_id)
validate_claim(claim, environment_id)
find_mappings(source_claim, environment_id, target_namespace=None)
get_provider_manifest(provider_id, version)
get_environment(environment_id)
```

所有依赖语义版本状态的查询 MUST 使用显式锁定的 Semantic Environment，MUST NOT 使用隐式 latest/default Provider 状态。
'''
          spec, count = re.subn(
              r'## 10\.3 SemanticService Contract\n.*?(?=\n## 10\.4)',
              replacement.rstrip(),
              spec,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected exactly one §10.3 replacement, got {count}')
          spec_path.write_text(spec)

          design_path = Path('docs/superpowers/specs/2026-08-28-semantic-mcp-adapter-design.md')
          design = design_path.read_text()
          design, count = re.subn(
              r'^\*\*Status:\*\*.*$',
              '**Status:** Approved for implementation; aligned with DSP v0.6  ',
              design,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit(f'expected exactly one design status replacement, got {count}')
          design_path.write_text(design)
          PY
      - name: Commit synchronized docs
        run: |
          if git diff --quiet -- docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md docs/superpowers/specs/2026-08-28-semantic-mcp-adapter-design.md; then
            echo 'No documentation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md docs/superpowers/specs/2026-08-28-semantic-mcp-adapter-design.md
          git commit -m 'docs(semantic): align Semantic MCP contracts'
          git push origin HEAD:feat/semantic-mcp-adapter
