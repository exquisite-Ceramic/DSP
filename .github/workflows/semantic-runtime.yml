name: Semantic runtime verification

on:
  push:
    branches:
      - 'feat/semantic-runtime'
    paths:
      - 'platform/semantic_runtime/**'
      - 'tests/semantic_runtime/**'
      - '.github/workflows/semantic-runtime.yml'
  pull_request:
    paths:
      - 'platform/semantic_runtime/**'
      - 'tests/semantic_runtime/**'
      - '.github/workflows/semantic-runtime.yml'
  workflow_dispatch:

jobs:
  semantic-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          python -m pip install pytest pytest-asyncio jsonschema
          python -m pip install -e contracts/python -e hosts/autocad/sidecar -e platform/semantic_runtime
      - name: Run D5 semantic runtime tests
        run: pytest -q tests/semantic_runtime
      - name: Run full Python regression tests
        run: pytest -q contracts/python/tests tests/contracts tests/integration tests/orchestrator tests/semantic_runtime
