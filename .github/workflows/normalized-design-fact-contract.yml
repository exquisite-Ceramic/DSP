name: Normalized Design Fact Contract

on:
  pull_request:
    paths:
      - "contracts/**"
      - "hosts/autocad/plugin/AutoCAD.AgentHost/Native/**"
      - "hosts/autocad/plugin/AutoCAD.AgentHost/Commands/**"
      - "hosts/autocad/sidecar/**"
      - "tests/contracts/test_autocad_*fact*.py"
      - "tests/integration/test_autocad_native_fact_command.py"
      - "docs/superpowers/specs/2026-08-28-normalized-design-fact-contract-design.md"
      - "docs/superpowers/plans/2026-08-28-normalized-design-fact-contract.md"
      - "docs/superpowers/specs/2026-08-29-autocad-native-fact-extractor-design.md"
      - "docs/superpowers/plans/2026-08-29-autocad-native-fact-extractor.md"
      - ".github/workflows/normalized-design-fact-contract.yml"

jobs:
  python-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install regression dependencies
        run: |
          python -m pip install pytest pytest-asyncio jsonschema PyYAML==6.0.3
          python -m pip install -e contracts/python -e hosts/autocad/sidecar -e platform/semantic_runtime -e platform/semantic_service
      - name: Run Step 18 contract tests
        run: |
          python -m pytest \
            contracts/python/tests/test_normalized_design_fact_contract.py \
            contracts/python/tests/test_normalized_design_fact_schema.py \
            contracts/python/tests/test_design_fact_architecture.py -q
      - name: Run Step 19 AutoCAD native fact tests
        run: |
          python -m pytest \
            tests/contracts/test_autocad_design_fact_adapter.py \
            tests/contracts/test_autocad_native_fact_architecture.py \
            tests/integration/test_autocad_native_fact_command.py -q
      - name: Run relevant Python regression tests
        run: pytest -q contracts/python/tests tests/contracts tests/integration tests/orchestrator tests/semantic_runtime tests/semantic_service

  dotnet-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Run .NET contract tests
        run: |
          dotnet test contracts/dotnet/DesignFactContracts.Tests/DesignFactContracts.Tests.csproj --configuration Release
          dotnet test contracts/dotnet/HostContracts.Tests/HostContracts.Tests.csproj --configuration Release
