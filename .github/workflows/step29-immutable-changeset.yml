name: Step29 immutable canonical changeset

on:
  push:
    paths:
      - "platform/changeset/**"
      - "platform/impact/src/design_impact/__init__.py"
      - "platform/impact/src/design_impact/bound_analysis.py"
      - "tests/changeset/**"
      - "pyproject.toml"
      - "docs/superpowers/specs/2026-08-29-step29-immutable-canonical-changeset-design.md"
      - "docs/superpowers/plans/2026-08-29-step29-immutable-canonical-changeset.md"
      - ".github/workflows/step29-immutable-changeset.yml"
  pull_request:
    paths:
      - "platform/changeset/**"
      - "platform/impact/src/design_impact/__init__.py"
      - "platform/impact/src/design_impact/bound_analysis.py"
      - "tests/changeset/**"
      - "pyproject.toml"
      - "docs/superpowers/specs/2026-08-29-step29-immutable-canonical-changeset-design.md"
      - "docs/superpowers/plans/2026-08-29-step29-immutable-canonical-changeset.md"
      - ".github/workflows/step29-immutable-changeset.yml"
  workflow_dispatch:

jobs:
  step29-immutable-changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Step29 verification stack
        run: |
          python -m pip install pytest pytest-asyncio jsonschema PyYAML==6.0.3 ruff
          python -m pip install \
            -e contracts/python \
            -e hosts/autocad/sidecar \
            -e platform/changeset \
            -e platform/semantic_runtime \
            -e platform/semantic_service \
            -e platform/semantic_mcp \
            -e providers/semantics/dsp_core \
            -e providers/semantics/ifc43 \
            -e providers/semantics/metro_v32 \
            -e providers/semantics/enterprise_mapping
      - name: Verify Step29 PR diff boundary
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/step29-immutable-canonical-changeset'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/step29-immutable-changeset\.yml|docs/superpowers/(specs/2026-08-29-step29-immutable-canonical-changeset-design|plans/2026-08-29-step29-immutable-canonical-changeset)\.md|platform/impact/src/design_impact/(__init__|bound_analysis)\.py|platform/changeset/pyproject\.toml|platform/changeset/src/design_changeset/(__init__|contracts|hashing|builder)\.py|platform/changeset/src/changeset/(model|builder|execution_slice|execution_unit|verification)\.py|pyproject\.toml|tests/changeset/test_step29_(step27_binding|contracts|hashing|builder|derived_builder|finalization|architecture)\.py)$' || true)"
          if [ -n "$bad" ]; then
            echo "Step29 changed files outside approved boundary:"
            printf '%s\n' "$bad"
            exit 1
          fi
      - name: Run Step29 Step27 binding tests
        run: pytest -q tests/changeset/test_step29_step27_binding.py
      - name: Run Step29 contract tests
        run: pytest -q tests/changeset/test_step29_contracts.py
      - name: Run Step29 hashing tests
        run: pytest -q tests/changeset/test_step29_hashing.py
      - name: Run Step29 root builder tests
        run: pytest -q tests/changeset/test_step29_builder.py
      - name: Run Step29 derived builder tests
        run: pytest -q tests/changeset/test_step29_derived_builder.py
      - name: Run Step29 finalization tests
        run: pytest -q tests/changeset/test_step29_finalization.py
      - name: Run Step29 architecture guards
        run: pytest -q tests/changeset/test_step29_architecture.py
      - name: Run Step28 regressions
        run: pytest -q tests/approval_scope
      - name: Run Step27 regressions
        run: pytest -q tests/impact
      - name: Run Step25 parameter binder regression
        run: pytest -q tests/orchestrator/test_step25_parameter_binder.py tests/orchestrator/test_step25_architecture.py
      - name: Run Step26 interaction regressions
        run: pytest -q tests/orchestrator/test_step26_interactive_binding.py tests/interaction/test_step26_interaction_coordinator.py tests/interaction/test_step26_architecture.py
      - name: Run Step24 resolver regressions
        run: pytest -q tests/orchestrator/test_step24_semantic_eligibility.py tests/orchestrator/test_operation_resolver.py
      - name: Run D4 to D5 freshness bridge regression
        run: pytest -q tests/semantic_runtime/test_d4_freshness_integration.py
      - name: Run Ruff on Step29 Python changes
        run: ruff check platform/changeset/src/design_changeset platform/impact/src/design_impact/__init__.py platform/impact/src/design_impact/bound_analysis.py tests/changeset
      - name: Run full repository Python test suite
        run: pytest -q --import-mode=importlib
