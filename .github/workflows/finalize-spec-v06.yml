name: Finalize DSP spec v0.6

on:
  push:
    branches:
      - feat/semantic-runtime

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-runtime
          fetch-depth: 0

      - name: Patch and verify exact spec blob
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path("docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md")
          text = path.read_text(encoding="utf-8")

          fixes = [
              ("Provider 不得静默覆盖兞他 Provider 的权威 namespace。", "Provider 不得静默覆盖其他 Provider 的权威 namespace。"),
              ("Semantic MCP Server 与 SemanticProvider Protocol 的边界通过 ADR 冻结［", "Semantic MCP Server 与 SemanticProvider Protocol 的边界通过 ADR 冻结；"),
          ]

          for old, new in fixes:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          data = path.read_bytes()
          blob_sha = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          expected = "ed4ce8a27ee9ad00aae799c7477a44546332b60c"
          print(f"verified blob sha: {blob_sha}")
          if blob_sha != expected:
              raise SystemExit(f"blob mismatch: expected {expected}, got {blob_sha}")
          PY

      - name: Commit finalized spec and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md
          git rm .github/workflows/finalize-spec-v06.yml
          git commit -m "docs: finalize DSP architecture spec v0.6"
          git push origin HEAD:feat/semantic-runtime
