name: Product Front Door verification

on:
  push:
    paths:
      - ".github/workflows/product-front-door.yml"
      - "platform/product_front_door/**"
      - "platform/product_runtime/**"
      - "platform/orchestrator/**"
      - "hosts/revit/sidecar/**"
      - "tests/product_front_door/**"
      - "tests/product_runtime/**"
      - "tests/integration/test_mcp_agent_front_door_live_support.py"
      - "docs/runbooks/mcp-agent-front-door.md"
  pull_request:
    paths:
      - ".github/workflows/product-front-door.yml"
      - "platform/product_front_door/**"
      - "platform/product_runtime/**"
      - "platform/orchestrator/**"
      - "hosts/revit/sidecar/**"
      - "tests/product_front_door/**"
      - "tests/product_runtime/**"
      - "tests/integration/test_mcp_agent_front_door_live_support.py"
      - "docs/runbooks/mcp-agent-front-door.md"
  workflow_dispatch:

jobs:
  product-front-door-postgres:
    name: Product Front Door PostgreSQL 17 gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dsp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DSP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/dsp_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install repository verification stack from committed lock
        run: |
          # Task 9/10 都必须从 committed uv.lock 重建，避免 MCP/PostgreSQL 验收依赖漂移。
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Collect Task 10 live support without claiming interactive acceptance
        run: |
          # GitHub-hosted CI 故意不设置 DSP_FRONT_DOOR_LIVE，也不提供 fake Revit/model/human。
          # 这里必须只证明 live-support test 可被收集并安全 SKIP；mandatory controlled live gate
          # 仍只能按 runbook 在真实 Windows/Revit 环境执行。
          uv run python -m pytest \
            tests/integration/test_mcp_agent_front_door_live_support.py -q -vv
      - name: Verify Task 9 durable recovery and real MCP product behavior
        run: |
          # 两个 Task 9 acceptance 文件覆盖 client rebuild、SQLite atomic freeze、
          # real loopback Streamable HTTP、candidate drift、Host-independent durable GET，
          # 以及 ContextSnapshot 后 composition rebuild 的当前 fail-closed 边界。
          uv run python -m pytest \
            tests/product_front_door/test_durable_recovery_postgres.py \
            tests/product_front_door/test_mcp_product_end_to_end.py -q -vv
      - name: Expose Task 9 server-side failure telemetry
        if: failure()
        run: |
          # MCP SDK 会把 server domain exception 净化成通用 tool error；失败时只输出
          # Task 9 临时目录里的 server-side telemetry，避免靠猜测修改生产协议。
          find /tmp/pytest-of-runner -type f \
            \( -name '*server-error*.txt' -o -name 'first-server-error.txt' -o -name 'second-server-error.txt' \) \
            -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; 2>/dev/null || true
      - name: Verify ProductTask PostgreSQL query and start-gate crash windows
        run: |
          # Task 9 不重写 ProductTask owner；这里把其既有 exact-query / single-lineage
          # PostgreSQL 契约与 Front Door acceptance 绑定在同一 PG17 gate，并覆盖 production
          # composition 会复用的 shared flow/shared gate 并发入口。
          uv run python -m pytest \
            tests/product_runtime/test_product_task_query_postgres.py \
            tests/product_runtime/test_product_task_start_gate_postgres.py \
            tests/product_runtime/test_product_task_shared_start_gate_postgres.py -q
      - name: Verify real Product Runtime owner chain and fail-closed recovery
        run: |
          # 复用既有 public reference composition 的真实 policy/Gateway/Saga/Reconciliation
          # 与外部 Revit fake，证明 operation proposal、live-composition resume、Host response-loss
          # idempotency、approval-scope/grant fail-closed 都与 Front Door gate 同步回归。
          uv run python -m pytest \
            tests/product_runtime/test_revit_wall_thickness_product_e2e.py \
            tests/product_runtime/test_revit_wall_thickness_product_recovery.py \
            tests/product_runtime/test_revit_wall_thickness_product_authorization_failures.py -q
      - name: Verify Front Door service and MCP authority regressions
        run: |
          # 保持 submit/get/resume 的 authority ordering、wire schema 与真实 client transport
          # 一起回归，避免 Task 9 acceptance 通过但薄边界契约发生漂移。
          uv run python -m pytest \
            tests/product_front_door/test_service.py \
            tests/product_front_door/test_service_resume.py \
            tests/product_front_door/test_mcp_wire.py \
            tests/product_front_door/test_mcp_client.py \
            tests/product_front_door/test_reference_client.py \
            tests/product_front_door/test_reference_client_cli.py -q
      - name: Enforce absolute Ruff clean on Task 9 and Task 10 acceptance paths
        run: |
          # Task 9/10 与后续 review regression 的新增 acceptance 直接要求 absolute E/F/I clean；
          # 既有路径继续由 Repository Regression 管理。
          uv run ruff check --select E,F,I \
            tests/product_front_door/test_durable_recovery_postgres.py \
            tests/product_front_door/test_mcp_product_end_to_end.py \
            tests/product_runtime/test_product_task_shared_start_gate_postgres.py \
            tests/integration/test_mcp_agent_front_door_live_support.py
