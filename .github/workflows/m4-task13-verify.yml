name: M4 Task 13 host matrix verifier

on:
  push:
    branches:
      - feat/technology-modernization-m1

permissions:
  contents: write

jobs:
  governance-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Stage Task 13 governance evidence as ledger-only commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ledger = Path("docs/superpowers/modernization/modernization-ledger.md")
          lines = ledger.read_text(encoding="utf-8").splitlines()
          edits = 0

          for index, line in enumerate(lines):
              if line.startswith("**Record state:**"):
                  lines[index] = (
                      "**Record state:** M0 Task 3 decisions frozen; M2 Tasks 7-8 runtime compatibility verified; "
                      "M3 Tasks 9-11 verified; M4 Tasks 12-13 code-generation reproducibility, wire parity, "
                      "and executable Host compatibility matrix verified"
                  )
                  edits += 1
                  continue

              if not (line.startswith("| MOD-010 |") or line.startswith("| MOD-011 |")):
                  continue

              parts = line.split("|")
              if len(parts) != 14:
                  raise SystemExit(f"unexpected ledger column count for {parts[1].strip()}: {len(parts)}")

              mod_id = parts[1].strip()
              parts[9] = " VERIFIED "
              if parts[10].strip() != "APPROVED":
                  raise SystemExit(f"unexpected execution state for {mod_id}: {parts[10].strip()}")

              evidence = parts[11].strip()
              if "Task 13 executable Host matrix" in evidence:
                  raise SystemExit(f"Task 13 evidence already present for {mod_id}")

              if mod_id == "MOD-010":
                  evidence += (
                      " Task 13 executable Host matrix records only the already-proven Revit 2027 native row as "
                      "`SUPPORTED`: Autodesk Revit 2027 uses .NET 10 and its add-in guidance requires a .NET 10 SDK; "
                      "`docs/runbooks/revit-wall-thickness-gap-closure.md` records Revit build `27.2.0.39` at "
                      "`c8b652f61d9b0aebc1c8d4c5938679b5855c71c3`, `net10.0-windows`, native build PASS with 0 errors, "
                      "and real Revit acceptance PASS including the 300 mm mutation, stable precommit negatives, replay, "
                      "and reconciliation. Phase I PR #30 head `502fac1a2ea174f716e30e16b4b8ca5b4e061879` records the "
                      "real positive dual-Host and partial-commit gates PASS. Task 13 focused verifier `35037478339` at "
                      "`b742699906c7b5fbc4f6dbb35e2aab1feff37e97` passed the Host-matrix contract `2/2`, absolute E/F/I Ruff, "
                      "and proved the Revit native plugin boundary is byte-identical to post-Phase-I baseline "
                      "`e308e9279d17ab61ef0d30c874942ce273a0a3f9` (csproj blob "
                      "`5730b9c91035fda50f65475596276dcb3107eb67`). Same-head canonical run `35037478336` passed Python "
                      "3.11/3.14 in both pytest modes with `1494 passed / 17 skipped`, Ruff `321 -> 319 / new 0`, "
                      "and Revit net8/net10 GREEN. This verifies the `KEEP` disposition for the explicit Revit 2027 row; "
                      "Revit 2025 and any other unproven release remain `NOT VERIFIED`, and Task 13 makes no native or "
                      "Host-visible implementation change."
                  )
              elif mod_id == "MOD-011":
                  evidence += (
                      " Task 13 executable Host matrix records only the already-proven AutoCAD 2025 native row as "
                      "`SUPPORTED`: Autodesk documents AutoCAD 2025 on .NET 8; the native project remains "
                      "`net8.0-windows` and resolves `AcCoreMgd.dll`, `AcDbMgd.dll`, and `AcMgd.dll` from "
                      "`$(AUTOCAD_ACAD_DIR)`. `docs/runbooks/autocad-grpc-smoke.md` records the AutoCAD 2025 SDK build "
                      "and all 12 real-Host gates PASS, with the latest AutoCAD-specific Gate 11/12 commit "
                      "`157c54d88fc401ede20944c5d477dbb3e0d95bf6`; Phase I PR #30 head "
                      "`502fac1a2ea174f716e30e16b4b8ca5b4e061879` records the real positive dual-Host and partial-commit gates PASS. "
                      "Task 13 focused verifier `35037478339` at `b742699906c7b5fbc4f6dbb35e2aab1feff37e97` passed the "
                      "Host-matrix contract `2/2`, absolute E/F/I Ruff, and proved the AutoCAD native plugin boundary is "
                      "byte-identical to post-Phase-I baseline `e308e9279d17ab61ef0d30c874942ce273a0a3f9` (csproj blob "
                      "`6173973bf5e221c0a34197c50fc978ec5481f58a`). Same-head canonical run `35037478336` passed Python "
                      "3.11/3.14 in both pytest modes with `1494 passed / 17 skipped`, Ruff `321 -> 319 / new 0`, "
                      "and Revit net8/net10 GREEN. This verifies the `KEEP` disposition for the explicit AutoCAD 2025 row; "
                      "AutoCAD 2026/2027 remain `NOT VERIFIED`, and Task 13 makes no native or Host-visible implementation change."
                  )
              else:
                  raise AssertionError(mod_id)

              parts[11] = f" {evidence} "
              lines[index] = "|".join(parts)
              edits += 1

          if edits != 3:
              raise SystemExit(f"unexpected Task 13 ledger edit count: {edits}")

          ledger.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/modernization/modernization-ledger.md
          git diff --cached --stat
          git commit -m "docs: record task13 host compatibility evidence"
          echo "DOCS_COMMIT=$(git rev-parse HEAD)"
      - name: Upload docs commit behind an intentionally rejected workflow guard
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# upload guard: this commit must not move the branch\n' >> .github/workflows/m4-task13-verify.yml
          git add .github/workflows/m4-task13-verify.yml
          git commit -m "ci: task13 upload guard"
          echo "GUARD_COMMIT=$(git rev-parse HEAD)"
          set +e
          OUTPUT="$(git push origin HEAD:feat/technology-modernization-m1 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUTPUT"
          test "$RC" -ne 0
          printf '%s\n' "$OUTPUT" | grep -qi 'workflow'
