name: M5 Task 14 canonical consistency verifier

on:
  push:
    branches:
      - feat/technology-modernization-m1

permissions:
  contents: write

jobs:
  governance-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Rebuild locked workspace
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Stage Task 14 no-cutover ledger evidence and prove consistency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ledger = Path("docs/superpowers/modernization/modernization-ledger.md")
          lines = ledger.read_text(encoding="utf-8").splitlines()
          edits = 0

          for index, line in enumerate(lines):
              if line.startswith("**Record state:**"):
                  lines[index] = (
                      "**Record state:** M0 Task 3 decisions frozen; M2 Tasks 7-8 runtime compatibility verified; "
                      "M3 Tasks 9-11 verified; M4 Tasks 12-13 verified; M5 Task 14 evaluated with no eligible canonical cutover"
                  )
                  edits += 1
                  continue

              if not (line.startswith("| MOD-001 |") or line.startswith("| MOD-012 |")):
                  continue

              parts = line.split("|")
              if len(parts) != 14:
                  raise SystemExit(f"unexpected ledger column count for {parts[1].strip()}: {len(parts)}")

              mod_id = parts[1].strip()
              status = parts[9].strip()
              execution = parts[10].strip()
              if (status, execution) != ("APPROVED", "APPROVED"):
                  raise SystemExit(
                      f"Task 14 expected {mod_id} to remain APPROVED / APPROVED, got {status} / {execution}"
                  )

              evidence = parts[11].strip()
              if "Task 14 cutover decision `NO_CUTOVER`" in evidence:
                  raise SystemExit(f"Task 14 evidence already present for {mod_id}")

              if mod_id == "MOD-001":
                  evidence += (
                      " Task 14 cutover decision `NO_CUTOVER`: M5 re-read the frozen ledger before changing canonical "
                      "ownership and found MOD-001 still `APPROVED / APPROVED`, not `VERIFIED`. Task 7 therefore remains "
                      "compatibility evidence only. The coordinated M5 gate intentionally leaves root `requires-python >=3.11`, "
                      "Ruff `py311`, Python 3.11 canonical CI, and Python 3.14 compatibility unchanged. The new "
                      "`test_modernization_canonical_consistency.py` prevents a future silent promotion while this ledger state "
                      "remains unverified."
                  )
              elif mod_id == "MOD-012":
                  evidence += (
                      " Task 14 cutover decision `NO_CUTOVER`: M5 found MOD-012 still `APPROVED / APPROVED`, not `VERIFIED`, "
                      "so Task 8 remains Host-neutral .NET 10 compatibility evidence rather than repository-wide SDK-cutover "
                      "authorization. Root `global.json` stays on SDK 8.0.100 with `latestFeature`, Revit Core stays canonical "
                      "`net8.0`, and the opt-in net10 lane remains compatibility-only. Native Host targets remain owned by the "
                      "Task 13 Host matrix."
                  )
              else:
                  raise AssertionError(mod_id)

              parts[11] = f" {evidence} "
              lines[index] = "|".join(parts)
              edits += 1

          if edits != 3:
              raise SystemExit(f"unexpected Task 14 ledger edit count: {edits}")

          ledger.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          uv run python -m pytest tests/architecture/test_modernization_canonical_consistency.py -q
          uv run ruff check --select E,F,I tests/architecture/test_modernization_canonical_consistency.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/modernization/modernization-ledger.md
          git diff --cached --stat
          git commit -m "docs: record m5 no-cutover evidence"
          echo "DOCS_COMMIT=$(git rev-parse HEAD)"
      - name: Upload ledger commit behind an intentionally rejected workflow guard
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# upload guard: this commit must not move the branch\n' >> .github/workflows/m5-task14-verify.yml
          git add .github/workflows/m5-task14-verify.yml
          git commit -m "ci: task14 upload guard"
          echo "GUARD_COMMIT=$(git rev-parse HEAD)"
          set +e
          OUTPUT="$(git push origin HEAD:feat/technology-modernization-m1 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUTPUT"
          test "$RC" -ne 0
          printf '%s\n' "$OUTPUT" | grep -qi 'workflow'
