name: Task 6R.2 interleaved RED

on:
  push:
    branches:
      - diag/task6r2-interleaved-red

permissions:
  contents: read

jobs:
  interleaved-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install repository verification stack from committed lock
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run Task 6R.2 interleaved RED
        run: |
          uv run pytest \
            tests/orchestrator/test_canonical_owner_ports.py \
            -k "interleaved and revisions and freshness and lineage" -q
