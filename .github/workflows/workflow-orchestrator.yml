name: Task 9 Ruff diagnosis

on:
  push:
  workflow_dispatch:

jobs:
  ruff-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff from committed lock
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Capture exact Ruff diagnostics
        run: |
          uv run ruff check platform/product_runtime tests/product_runtime \
            --output-format json > ruff-report.json || true
      - name: Upload exact Ruff diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: task9-ruff-report
          path: ruff-report.json
          if-no-files-found: error
