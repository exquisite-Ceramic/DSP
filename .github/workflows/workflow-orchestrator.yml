name: Task 9 Ruff diagnosis

on:
  push:
  workflow_dispatch:

jobs:
  ruff-plc0415:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff from committed lock
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Prove import-outside-top-level violation
        run: uv run ruff check tests/product_runtime/conftest.py --select PLC0415

  ruff-default-without-plc0415:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff from committed lock
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Prove no other default Ruff violation remains
        run: uv run ruff check tests/product_runtime/conftest.py --ignore PLC0415
