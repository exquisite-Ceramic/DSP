name: Task 9 Ruff diagnosis

on:
  push:
  workflow_dispatch:

jobs:
  ruff-diagnosis:
    name: ruff-${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: F401
            args: "--select F401"
          - label: F402
            args: "--select F402"
          - label: F811
            args: "--select F811"
          - label: F821
            args: "--select F821"
          - label: F841
            args: "--select F841"
          - label: F-other
            args: "--select F --ignore F401,F402,F811,F821,F841"
          - label: E4
            args: "--select E4"
          - label: E7
            args: "--select E7"
          - label: E9
            args: "--select E9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff from committed lock
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Check conftest rule family
        run: uv run ruff check tests/product_runtime/conftest.py ${{ matrix.args }}
