name: Task 8 full GREEN 5eaf7f93

on:
  push:
    branches:
      - diag/task8-full-green-5eaf7f93

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5eaf7f9397ae1fbb000550fabc98debda849f335
          fetch-depth: 0

      - name: Assert exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "5eaf7f9397ae1fbb000550fabc98debda849f335"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install committed verification stack
        shell: bash
        run: |
          python -m pip install uv
          uv sync --locked --all-packages

      - name: Run Task 8 full focused suite
        shell: bash
        run: |
          uv run pytest \
            tests/product_front_door/test_mcp_client.py \
            tests/product_front_door/test_reference_client.py \
            tests/product_front_door/test_reference_client_cli.py \
            -q -vv

      - name: Run Task 8 absolute Ruff
        shell: bash
        run: |
          uv run ruff check \
            platform/product_front_door/src/design_product_front_door/mcp_client.py \
            platform/product_front_door/src/design_product_front_door/reference_client.py \
            platform/product_front_door/src/design_product_front_door/__init__.py \
            tests/product_front_door/test_mcp_client.py \
            tests/product_front_door/test_reference_client.py \
            tests/product_front_door/test_reference_client_cli.py
