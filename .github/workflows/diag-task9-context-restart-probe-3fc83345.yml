name: Task 9 context restart probe 3fc83345

on:
  push:
    branches:
      - diag/task9-context-restart-probe-3fc83345

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dsp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DSP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/dsp_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3fc83345e5a4a3ed04d76e4d9207f7b923e4a3ec
          fetch-depth: 0
      - name: Assert exact product head
        run: test "$(git rev-parse HEAD)" = "3fc83345e5a4a3ed04d76e4d9207f7b923e4a3ec"
      - name: Restore diagnostic probe files
        run: |
          git checkout e45b879f1ae369bd3b8c7cf2ad557f4d2167f7d5 -- tests/product_front_door/_diag_task9_context_restart_probe.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install committed verification stack
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run context restart probe
        run: uv run pytest tests/product_front_door/_diag_task9_context_restart_probe.py -q -vv -s
