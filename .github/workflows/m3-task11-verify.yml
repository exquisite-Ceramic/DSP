name: M3 Task 11 action governance verifier

on:
  push:
    branches:
      - feat/technology-modernization-m1

jobs:
  action-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Rebuild locked workspace
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run Task 11 architecture contract
        run: uv run python -m pytest tests/architecture/test_modernization_actions.py -q
