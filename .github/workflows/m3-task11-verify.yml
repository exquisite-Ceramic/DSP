name: M3 Task 11 action governance verifier

on:
  push:
    branches:
      - feat/technology-modernization-m1

permissions:
  contents: write

jobs:
  action-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Stage Task 11 governance evidence as docs-only commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger = Path('docs/superpowers/modernization/modernization-ledger.md')
          inventory = Path('docs/superpowers/modernization/dependency-inventory.md')

          ledger_lines = ledger.read_text(encoding='utf-8').splitlines()
          ledger_replacements = 0
          for i, line in enumerate(ledger_lines):
              if line.startswith('**Record state:**'):
                  ledger_lines[i] = '**Record state:** M0 Task 3 decisions frozen; M2 Tasks 7-8 runtime compatibility verified; M3 Tasks 9-11 resolver, dependency-family, Action-family, and bounded dependency-automation work verified  '
                  ledger_replacements += 1
              elif line.startswith('| MOD-008 |'):
                  ledger_lines[i] = '| MOD-008 | GitHub Actions | hosted workflows now use `actions/checkout@v7`, `actions/setup-python@v7`, and `actions/setup-dotnet@v6`; the Phase I real dual-Host self-hosted job remains the sole compatibility exception at `checkout@v4` / `setup-python@v5` pending runner proof | retain the supported Node-24-capable hosted Action majors while preserving the explicit self-hosted exception until its runner is proven `>=2.327.1` | T0 | UPGRADE | Build & Release | canonical + focused GitHub workflows | VERIFIED | APPROVED | Task 11 upgraded each family separately: checkout commit `b6dfe5292f169874678b521eaf173ed1f6ffdc35`, setup-python commit `1c89c83cd3b7a60054c44ceb6a4f4f636eb79c2d`, setup-dotnet commit `f091ebccdda0177f5fe2732ce8d17ea50635e5f8`. Family verifiers proved hosted migration while `tests/architecture/test_modernization_actions.py` keeps the Phase I self-hosted tail as the only deferred exception. Exact-head structural run `35033696892` at `38f31acf312c43f02d5ccfa6d279c4b9a67d8fb9` passed the three Task 11 workflow architecture files `17/17` plus absolute E/F/I Ruff. Canonical run `35033696790` on the same head passed Python 3.11 and 3.14 in both pytest modes with `1487 passed / 17 skipped`, Ruff `319 -> 319 / new 0`, and Revit net8/net10 `54/54`; the hosted runner reports `2.337.0`, satisfying Node-24 Action requirements. No unverified upgrade was applied to the required Windows self-hosted real-Host job | revert hosted Action refs to the previous known-green majors if workflow parity regresses; keep the self-hosted exception unchanged until its runner-version evidence satisfies the Node-24 minimum |'
                  ledger_replacements += 1
              elif line.startswith('| MOD-014 |'):
                  ledger_lines[i] = '| MOD-014 | Dependency automation | bounded Dependabot is committed for exactly `github-actions`, `uv`, `nuget`, and `dotnet-sdk`; all schedules are weekly with PR limits 2-3 and no auto-merge policy | retain governed candidate generation only for the approved ecosystems; every generated change still passes normal review and regression gates | T0/T1 | UPGRADE | Build & Release | dependency manifests and CI tooling | VERIFIED | APPROVED | Separate automation commit `34e35fa67e3047e56dbf6f85148548f69981b4bc` added `.github/dependabot.yml` without combining an Action-major change. `tests/architecture/test_modernization_actions.py` enforces the exact four approved ecosystems, weekly cadence, bounded `open-pull-requests-limit`, and absence of auto-merge. Exact-head structural run `35033696892` passed all Task 11 workflow governance tests and canonical run `35033696790` stayed GREEN on both Python lanes and both Revit compatibility lanes | remove `.github/dependabot.yml` or narrow the affected ecosystem if generated update behavior proves unsafe; do not add ecosystems, auto-merge, or Host/runtime cutovers without a separate approved decision |'
                  ledger_replacements += 1
          if ledger_replacements != 3:
              raise SystemExit(f'unexpected ledger replacement count: {ledger_replacements}')
          ledger.write_text('\n'.join(ledger_lines) + '\n', encoding='utf-8')

          inventory_lines = inventory.read_text(encoding='utf-8').splitlines()
          inventory_replacements = 0
          for i, line in enumerate(inventory_lines):
              if line.startswith('**Record state:**'):
                  inventory_lines[i] = '**Record state:** M0 Task 2 factual inventory complete; M1 Task 6 .NET ownership normalized; M3 Task 11 hosted Action and bounded dependency automation verified  '
                  inventory_replacements += 1
              elif line.startswith('**Observed:**'):
                  inventory_lines[i] = '**Observed:** 2026-09-16'
                  inventory_replacements += 1
              elif line.startswith('| CI_ACTION |'):
                  inventory_lines[i] = '| CI_ACTION | hosted workflows use `actions/checkout@v7`, `actions/setup-python@v7`, and `actions/setup-dotnet@v6`; the Phase I real dual-Host self-hosted tail remains an explicit `checkout@v4` / `setup-python@v5` compatibility exception pending runner-version proof | Build & Release / MOD-008 | Task 11 verified the hosted upgrades and preserves the self-hosted exception rather than dropping the required runner |'
                  inventory_replacements += 1
              elif line.startswith('Canonical repository truth is `.github/workflows/repository-regression.yml`:'):
                  inventory_lines[i] = 'Canonical repository truth is `.github/workflows/repository-regression.yml`: Python 3.11 canonical plus Python 3.14 compatibility, `actions/checkout@v7`, `actions/setup-python@v7`, reconstruction from the committed `uv.lock`, both canonical pytest modes, Ruff no-new-diagnostics, `actions/setup-dotnet@v6`, canonical .NET 8 Revit Core plus the isolated Host-neutral .NET 10 compatibility lane. Historical/domain workflows remain focused guards; real AutoCAD/Revit acceptance remains separate from Linux/offline canonical regression, and the Phase I real dual-Host self-hosted tail is the sole Action-major compatibility exception until its runner version is proven Node-24-capable.'
                  inventory_replacements += 1
              elif line.startswith('- GitHub Dependabot documents support for `github-actions`, `uv`, `.NET SDK`, and NuGet ecosystems;'):
                  inventory_lines[i] = '- GitHub Dependabot supports the approved `github-actions`, `uv`, `dotnet-sdk`, and `nuget` ecosystems; Task 11 now commits bounded weekly coverage for exactly those four ecosystems, with PR limits and no auto-merge.'
                  inventory_replacements += 1
              elif line.startswith("- GitHub's current setup-python examples use `actions/checkout@v7` and `actions/setup-python@v7`;"):
                  inventory_lines[i] = "- Task 11 verified the current hosted Action majors `actions/checkout@v7`, `actions/setup-python@v7`, and `actions/setup-dotnet@v6` against repository workflow parity and canonical regression; the required Windows self-hosted real-Host job is intentionally not upgraded without runner-version evidence."
                  inventory_replacements += 1
          if inventory_replacements != 6:
              raise SystemExit(f'unexpected inventory replacement count: {inventory_replacements}')
          inventory.write_text('\n'.join(inventory_lines) + '\n', encoding='utf-8')
          PY

          git diff --check
          git diff -- docs/superpowers/modernization/dependency-inventory.md docs/superpowers/modernization/modernization-ledger.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/modernization/dependency-inventory.md docs/superpowers/modernization/modernization-ledger.md
          git commit -m "docs: record task11 action governance"
          echo "DOCS_COMMIT=$(git rev-parse HEAD)"
      - name: Upload docs commit behind an intentionally rejected workflow guard
        shell: bash
        run: |
          printf '\n# upload guard: this commit must not move the branch\n' >> .github/workflows/m3-task11-verify.yml
          git add .github/workflows/m3-task11-verify.yml
          git commit -m "ci: task11 upload guard"
          echo "GUARD_COMMIT=$(git rev-parse HEAD)"
          set +e
          OUTPUT="$(git push origin HEAD:feat/technology-modernization-m1 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUTPUT"
          test "$RC" -ne 0
          printf '%s\n' "$OUTPUT" | grep -qi 'workflow'
