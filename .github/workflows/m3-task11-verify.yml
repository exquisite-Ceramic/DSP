name: M3 Task 11 action governance verifier

on:
  push:
    branches:
      - feat/technology-modernization-m1

jobs:
  action-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Rebuild locked workspace
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Verify Task 11 structural workflow behavior
        run: |
          uv run python -m pytest \
            tests/architecture/test_modernization_actions.py \
            tests/architecture/test_repository_regression_workflow.py \
            tests/architecture/test_historical_workflow_scope.py \
            -q
      - name: Verify Task 11 architecture test style
        run: uv run ruff check --select E,F,I tests/architecture/test_modernization_actions.py
