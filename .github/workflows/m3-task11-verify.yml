name: M3 Task 11 action governance verifier

on:
  push:
    branches:
      - feat/technology-modernization-m1

permissions:
  contents: write

jobs:
  action-governance:
    runs-on: ubuntu-latest
    env:
      MIGRATE_FAMILY: checkout
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Rebuild locked workspace
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Migrate exactly one hosted Action family
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path('.github/workflows')
          verifier = root / 'm3-task11-verify.yml'
          phase_i = root / 'phase-i-real-cross-host-materialization-saga.yml'
          marker = '\n  phase-i-real-dual-host:\n'
          replacements = {
              'checkout': ('actions/checkout@v4', 'actions/checkout@v7'),
              'setup-python': ('actions/setup-python@v5', 'actions/setup-python@v7'),
              'setup-dotnet': ('actions/setup-dotnet@v4', 'actions/setup-dotnet@v6'),
          }
          family = os.environ['MIGRATE_FAMILY']
          old, new = replacements[family]
          changed = []
          for path in sorted((*root.glob('*.yml'), *root.glob('*.yaml'))):
              if path == verifier:
                  continue
              text = path.read_text(encoding='utf-8')
              if path == phase_i:
                  hosted, self_hosted = text.split(marker, 1)
                  updated = hosted.replace(old, new) + marker + self_hosted
              else:
                  updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print(f'{family} changed files: {len(changed)}')
          for path in changed:
              print(path)
          if not changed:
              raise SystemExit(f'no hosted refs changed for {family}')
          PY
      - name: Verify migrated family boundary
        shell: bash
        run: |
          case "$MIGRATE_FAMILY" in
            checkout)
              uv run python -m pytest \
                tests/architecture/test_modernization_actions.py::test_hosted_checkout_uses_supported_node24_major \
                tests/architecture/test_modernization_actions.py::test_real_dual_host_job_is_the_only_deferred_action_compatibility_exception \
                -q
              ;;
            setup-python)
              uv run python -m pytest \
                tests/architecture/test_modernization_actions.py::test_hosted_setup_python_uses_supported_node24_major \
                tests/architecture/test_modernization_actions.py::test_real_dual_host_job_is_the_only_deferred_action_compatibility_exception \
                -q
              ;;
            setup-dotnet)
              uv run python -m pytest \
                tests/architecture/test_modernization_actions.py::test_hosted_setup_dotnet_uses_supported_node24_major \
                tests/architecture/test_modernization_actions.py::test_real_dual_host_job_is_the_only_deferred_action_compatibility_exception \
                -q
              ;;
          esac
      - name: Create verified remote commit object
        id: family-commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          base = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          family = os.environ['MIGRATE_FAMILY']
          paths = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          if not paths:
              raise SystemExit('no verified workflow changes to commit')

          def post(path: str, payload: dict) -> dict:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}',
                  data=json.dumps(payload).encode(),
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          tree = post(
              'git/trees',
              {
                  'base_tree': base,
                  'tree': [
                      {
                          'path': path,
                          'mode': '100644',
                          'type': 'blob',
                          'content': Path(path).read_text(encoding='utf-8'),
                      }
                      for path in paths
                  ],
              },
          )
          commit = post(
              'git/commits',
              {
                  'message': f'ci: upgrade {family} action family',
                  'tree': tree['sha'],
                  'parents': [base],
              },
          )
          print(f"REMOTE_COMMIT_SHA={commit['sha']}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"sha={commit['sha']}\n")
          PY
      - name: Show verified commit object
        run: echo "${{ steps.family-commit.outputs.sha }}"
