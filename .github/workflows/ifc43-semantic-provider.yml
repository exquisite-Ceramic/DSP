name: IFC4.3 semantic provider TDD

on:
  push:
    branches:
      - 'feat/ifc43-semantic-provider'
    paths:
      - 'providers/semantics/ifc43/**'
      - 'tests/semantic_providers/ifc43/**'
      - '.github/workflows/ifc43-semantic-provider.yml'
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pip install -e platform/semantic_service -e providers/semantics/dsp_core -e platform/semantic_mcp -e providers/semantics/ifc43
      - name: Run IFC4.3 focused tests
        run: pytest -q tests/semantic_providers/ifc43
