name: Task16 Ruff autofix scratch

on:
  push:
    branches:
      - feat/phase-i-real-cross-host-materialization-saga-task16-scratch-final
    paths:
      - .github/workflows/task16-ruff-autofix.yml

permissions:
  contents: write

jobs:
  ruff-autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply exact Ruff fixes to Task16 helper
        run: |
          python -m pip install ruff
          ruff check tests/integration/phase_i_live_host.py --fix
          ruff check tests/integration/phase_i_live_host.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/phase_i_live_host.py
          git commit -m "style: align task16 live harness with ruff"
          git push origin HEAD:feat/phase-i-real-cross-host-materialization-saga-task16-scratch-final
