name: Task 16 final verification

on:
  push:
    branches:
      - feat/technology-modernization-m1

permissions:
  contents: read

env:
  AGENT_HOST_TEST: "0"
  DSP_PHASE_I_LIVE: "0"
  DSP_REVIT_LIVE: "0"

jobs:
  python-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Rebuild and verify committed workspace
        run: |
          python -m pip install uv
          uv lock --check
          uv sync --locked --all-packages
      - name: Run both repository pytest modes
        run: |
          uv run python -m pytest --import-mode=importlib -q
          uv run python -m pytest -q
      - name: Run architecture closeout gate
        run: uv run python -m pytest tests/architecture -q
      - name: Enforce closeout guard Ruff cleanliness
        run: uv run ruff check --select E,F,I tests/architecture/test_modernization_governance.py
      - name: Check whitespace
        run: git diff --check HEAD^

  revit-core-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Run Revit AgentHost Core regression
        run: dotnet test hosts/revit/plugin/Revit.AgentHost.Core.Tests/Revit.AgentHost.Core.Tests.csproj -f net8.0

  autocad-grpc-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Run AutoCAD gRPC transport regression
        run: dotnet test hosts/autocad/transport/dotnet/AutoCAD.AgentHost.Grpc.Tests/AutoCAD.AgentHost.Grpc.Tests.csproj
