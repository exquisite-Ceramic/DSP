name: Task 16 Technology Modernization closeout verifier

on:
  push:
    branches:
      - feat/technology-modernization-m1

permissions:
  contents: write

jobs:
  closeout-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Rebuild locked workspace
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Stage Task 16 closeout records and prove governance
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/m7_task16_closeout.py
          uv run python -m pytest tests/architecture/test_modernization_governance.py -q
          uv run ruff check --select E,F,I tests/architecture/test_modernization_governance.py .github/scripts/m7_task16_closeout.py
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/superpowers/README.md docs/superpowers/modernization/modernization-ledger.md docs/superpowers/modernization/modernization-risk-register.md docs/superpowers/modernization/architecture-modernization-review-input.md
          git diff --cached --stat
          git commit -m "docs: close technology modernization"
          echo "DOCS_COMMIT=$(git rev-parse HEAD)"
      - name: Upload closeout commit behind an intentionally rejected workflow guard
        shell: bash
        run: |
          set -euo pipefail
          echo "# upload guard: this commit must not move the branch" >> .github/workflows/m7-task16-closeout.yml
          git add .github/workflows/m7-task16-closeout.yml
          git commit -m "ci: task16 upload guard"
          echo "GUARD_COMMIT=$(git rev-parse HEAD)"
          set +e
          OUTPUT="$(git push origin HEAD:feat/technology-modernization-m1 2>&1)"
          RC=$?
          set -e
          echo "$OUTPUT"
          test "$RC" -ne 0
          echo "$OUTPUT" | grep -qi "workflow"
