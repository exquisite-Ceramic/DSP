name: Task 7 MCP exact-head verification

on:
  push:
    branches:
      - diag/task7-mcp-green-2be3c46f

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2be3c46fd1251d3fa0493d11edd0a967e0e4aa9b
          fetch-depth: 0
      - name: Assert exact feature head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "2be3c46fd1251d3fa0493d11edd0a967e0e4aa9b"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install committed verification stack
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run focused Product Front Door tests
        run: |
          uv run pytest \
            tests/product_front_door/test_service.py \
            tests/product_front_door/test_composition_pool.py \
            tests/product_front_door/test_mcp_wire.py \
            tests/product_front_door/test_mcp_server.py \
            tests/product_front_door/test_mcp_transport.py -q -vv
      - name: Run absolute Product Front Door Ruff
        run: |
          uv run ruff check \
            platform/product_front_door/src/design_product_front_door \
            tests/product_front_door
