name: Task 8 reference client GREEN 089fae82

on:
  push:
    branches:
      - diag/task8-reference-client-green-089fae82

permissions:
  contents: read

jobs:
  verify-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 089fae8271ee8c020c56548b3f410f8d87de7fb8
          fetch-depth: 0

      - name: Assert exact GREEN head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "089fae8271ee8c020c56548b3f410f8d87de7fb8"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install committed verification stack
        shell: bash
        run: |
          python -m pip install uv
          uv sync --locked --all-packages

      - name: Run Task 8 focused GREEN
        shell: bash
        run: |
          uv run pytest \
            tests/product_front_door/test_mcp_client.py \
            tests/product_front_door/test_reference_client.py \
            -q -vv

      - name: Run Task 8 Ruff
        shell: bash
        run: |
          uv run ruff check \
            platform/product_front_door/src/design_product_front_door/mcp_client.py \
            platform/product_front_door/src/design_product_front_door/reference_client.py \
            platform/product_front_door/src/design_product_front_door/__init__.py \
            tests/product_front_door/test_mcp_client.py \
            tests/product_front_door/test_reference_client.py
