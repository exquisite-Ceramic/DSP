name: Task7 planning GREEN diagnostic v6

on:
  push:
    branches:
      - diag/task7-planning-green-v5

permissions:
  contents: write

jobs:
  focused-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diag/task7-planning-green-v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply exact v5 planning implementation
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          workflow = Path(".github/workflows/diag-task7-planning-green-v5.yml").read_text(encoding="utf-8")
          match = re.search(r'REPLACEMENT_B64: "([^"]+)"', workflow)
          if match is None:
              raise SystemExit("v5 replacement payload not found")

          adapter = Path("platform/orchestrator/src/design_orchestrator/canonical_owner_ports.py")
          text = adapter.read_text(encoding="utf-8")
          start = text.index("    def plan_execution(\n")
          end = text.index("\n    def check_revision_barrier", start)
          replacement = base64.b64decode(match.group(1)).decode("utf-8")
          adapter.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          census = Path("docs/superpowers/reviews/2026-09-20-real-owner-e2e-workflow-census.md")
          census_text = census.read_text(encoding="utf-8")
          old = "`design_convergence:ConvergenceComparisonProfile`<br>`design_convergence:build_convergence_profile`"
          new = "`design_convergence:ConvergenceComparisonProfile`<br>`design_convergence:ConvergenceProfileBuildRequest`<br>`design_convergence:build_convergence_profile`"
          if old not in census_text:
              raise SystemExit("convergence census marker not found")
          census.write_text(census_text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install repository verification stack from committed lock
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Apply safe Ruff fixes for Task7-touched files
        run: |
          uv run ruff check --fix platform/orchestrator/src/design_orchestrator/canonical_owner_ports.py tests/orchestrator/test_task7_planning.py || true
      - name: Run focused Task7 planning GREEN
        run: uv run python -m pytest tests/orchestrator/test_task7_planning.py -q
      - name: Run real-owner architecture guard
        run: uv run python -m pytest tests/architecture/test_real_owner_workflow_boundaries.py tests/architecture/test_canonical_v2_boundaries.py -q
      - name: Run Task7-focused Ruff excluding inherited TRY004 baseline
        run: uv run ruff check --ignore TRY004 platform/orchestrator/src/design_orchestrator/canonical_owner_ports.py tests/orchestrator/test_task7_planning.py
      - name: Commit verified planning GREEN without diagnostic files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diag-task7-planning-green-v5.yml .github/workflows/diag-task7-planning-green-v6.yml .diag-task7-planning-green-v5-trigger .diag-task7-planning-green-v6-trigger
          git add platform/orchestrator/src/design_orchestrator/canonical_owner_ports.py docs/superpowers/reviews/2026-09-20-real-owner-e2e-workflow-census.md tests/orchestrator/test_task7_planning.py
          git commit -m "feat: wire real Task7 planning owners"
          git push origin HEAD:diag/task7-planning-green-v5
