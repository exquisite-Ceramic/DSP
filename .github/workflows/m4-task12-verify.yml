name: M4 Task 12 proto codegen verifier

on:
  push:
    branches:
      - feat/technology-modernization-m1

jobs:
  proto-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Rebuild locked workspace
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run proto codegen reproducibility contract
        run: uv run python -m pytest tests/architecture/test_proto_codegen_reproducibility.py -q
