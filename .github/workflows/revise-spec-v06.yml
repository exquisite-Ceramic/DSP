name: Revise DSP spec v0.6

on:
  push:
    branches: [feat/semantic-runtime]
    paths: [.github/workflows/revise-spec-v06.yml]

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-runtime
          fetch-depth: 0
      - name: Apply spec corrections
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md')
          s = p.read_text(encoding='utf-8')

          # Revision note.
          marker = '> Metro Semantic 基线：`IFC4.3 地铁 BIM 数据标准 V3.2——构件属性增强合并版`，目标 Schema 为 `IFC4X3_ADD2 / IFC 4.3.2.0`\n'
          note = '> 修订说明：本轮补回 v0.5 已冻结的 Runtime / Execution / Governance 契约，并正式恢复 Progressive Semantic Model；Semantic MCP / Metro / Identity / Assurance 仍以 v0.6 新架构为准。\n'
          if note not in s:
              assert marker in s
              s = s.replace(marker, marker + note, 1)

          # Progressive Semantic Model is a first-class architecture principle.
          old = '系统不得依赖自然语言 description 执行约束判断。\n\n---\n\n# 3. 分层架构\n'
          new = '''系统不得依赖自然语言 description 执行约束判断。\n\n## 2.6 Progressive Semantic Model\n\nDSP SHALL 采用 **Progressive Semantic Modeling + On-demand Semantic Reconstruction**。平台不要求任何 Host 在持续编辑期间维护全量、实时、完整的 IFC/Metro 语义镜像。\n\n同一 Semantic Entity 按任务需要逐 aspect 提升，至少存在以下独立轴：\n\n```text\nSemantic Depth:     NATIVE → NORMALIZED → CANONICAL → DOMAIN\nGeometry Fidelity:  NONE → BOUNDS → APPROXIMATE → EXACT → NATIVE\nFreshness:          UNKNOWN / DIRTY / RECONSTRUCTING / FRESH / STALE\nAssurance:          UNKNOWN / HEURISTIC / RULE_DERIVED / STANDARD_MAPPED / NATIVE_ASSERTED\n```\n\n系统不得用单一 `L2/L3` 标签声称整个对象“已完全理解”。正确状态是 aspect-scoped：\n\n```yaml\nsemantic_id: S-WALL-001\ncoverage:\n  identity: resolved\n  classification: canonical\n  properties:\n    thickness: canonical\n    fire_rating: unresolved\n  geometry: bounds\n  relationships: partial\n  metro: unresolved\nfreshness:\n  identity: fresh\n  classification: fresh\n  properties: fresh\n  geometry: fresh\n```\n\n- Coverage / Maturity 回答“已经理解到什么程度”；\n- Freshness 回答“已知事实是否仍与当前 Host revision 对齐”；\n- Assurance 回答“事实如何得到、可信度如何”；\n- Geometry Fidelity 回答“几何证据精细到什么程度”。\n\nSemantic MCP / Provider SHOULD 仅按 Reconstruction Requirement 解析当前任务需要的 term / mapping / rule / projection，不应默认全量提升整个模型。\n\n---\n\n# 3. 分层架构\n'''
          if '## 2.6 Progressive Semantic Model' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          # Keep MCP version intent from v0.5 without making it a domain boundary.
          old = 'MCP 只定义服务协议和发现/调用机制，不定义领域权威边界。\n\n平台模块 SHALL 依赖稳定领域 Contract，不 SHALL 直接依赖某个具体 MCP Server 实现。\n'
          new = 'MCP 只定义服务协议和发现/调用机制，不定义领域权威边界。\n\n除非后续 ADR 显式修改，协议目标基线沿用 v0.5 的 `MCP 2026-07-28`。具体协议版本属于兼容性配置，不得改变领域边界。\n\n平台模块 SHALL 依赖稳定领域 Contract，不 SHALL 直接依赖某个具体 MCP Server 实现。\n'
          if new not in s:
              assert old in s
              s = s.replace(old, new, 1)

          # Host-native interaction / view contract.
          old = '高语义 Host（例如 BIM Host）应尽量采用薄转换，保留原生语义证据但不把 Host ontology 带入 Core。\n\n---\n\n# 7. D3 — Design Capability\n'
          new = '''高语义 Host（例如 BIM Host）应尽量采用薄转换，保留原生语义证据但不把 Host ontology 带入 Core。\n\n## 6.4 Host-native Interaction / View\n\n空间选择、点位、方向、视图聚焦等 SHOULD 尽量保留在 Host 内完成。VIEW / CONTEXT / INTERACTION 不因使用 MCP 就自动成为模型写操作。\n\nAutoCAD reference UX MAY 继续采用：\n\n```text\nAgent Orb → Peek → Task Card → Host Canvas\n```\n\n这是 reference UX，不是跨 Host 强制 UI；强制的是 typed InteractionSession、VIEW 不生成 ChangeSet、native spatial input 不由 LLM 猜测。\n\n---\n\n# 7. D3 — Design Capability\n'''
          if '## 6.4 Host-native Interaction / View' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          # Capability categories and Phase-A/Phase-B responsibility.
          marker = 'provider input/output schema\n```\n'
          addition = '''\n`category` SHALL 至少支持：\n\n```text\nMODEL_OPERATION  # 修改设计事实；必须经过 ChangeSet\nINTERACTION      # Host-native 用户输入\nVIEW             # 视图导航；不产生 ChangeSet\nCONTEXT          # Host 上下文读取；read-only\n```\n\nProvider Profile 的 freshness 默认解释为 **Operation / Execution Freshness（Phase B）**。Context Freshness（Phase A）由平台根据 canonical operation taxonomy、canonical entity constraints 与 Host context 派生，第三方 Provider 不得借 capability discovery 强制平台读取任意高成本语义。\n'''
          pos = s.index('# 7. D3 — Design Capability')
          next_pos = s.index('# 8. Canonical Action Catalog')
          d3 = s[pos:next_pos]
          if '`category` SHALL 至少支持' not in d3:
              i = s.index(marker, pos, next_pos) + len(marker)
              s = s[:i] + addition + s[i:]

          # D5 progressive coverage + geometry fidelity.
          old = '`CLASSIFICATION` 为一等 aspect。\n\n## 19.7 Freshness\n'
          new = '''`CLASSIFICATION` 为一等 aspect。\n\n### 19.6.1 Progressive aspect coverage\n\n不同 aspect MAY 独立达到不同 semantic depth / coverage；D5 不要求一次 reconstruction 生成完整对象。Operation Resolver、Impact Analyzer 与 ChangeSetBuilder 只能消费 contract 明确保证的 coverage，不得把局部 reconstruction 推断成全模型完整语义。\n\n### 19.6.2 Geometry Progressive Levels\n\n| Level | 名称 | 内容 | 典型用途 |\n|---|---|---|---|\n| 0 | NONE | 不读取 geometry | 纯属性/分类 |\n| 1 | BOUNDS | AABB/OBB/axis/centroid | 定位、粗筛、Context Freshness |\n| 2 | APPROXIMATE | 简化 curve/mesh | broad-phase |\n| 3 | EXACT | 精确可计算几何 | 精确 clash/opening/offset validation |\n| 4 | NATIVE | Host 原生几何上下文 | 必须由 Host kernel 决定的操作 |\n\nPhase A SHOULD 默认限制在 `NONE/BOUNDS`，除非 operation applicability 无法在低成本事实上判断。\n\n## 19.7 Freshness\n'''
          if '### 19.6.1 Progressive aspect coverage' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = '以及 Context Freshness / Operation Freshness 两阶段 barrier。\n\n## 19.8 Change Journal / DirtyMap\n'
          new = '''以及 Context Freshness / Operation Freshness 两阶段 barrier。\n\nFreshness Contract SHALL 明确：\n\n```text\ncontract_id\nproject_id\ncontract_type: CONTEXT | OPERATION\nroot_entities[]\nrequirements[]: aspect / required_state / geometry_level?\nneighborhood: depth / relations[]\n```\n\nPhase A 只保证 operation discovery/applicability 的最小事实；Phase B 在 canonical operation、targets 与 material arguments 已知后生成精确要求。若 operation、targets 或影响 freshness requirements 的关键参数改变，必须重新派生 Phase B contract。\n\nFreshness 与 Coverage/Maturity 严格分离：`FRESH` 只表示已声明 coverage 内事实与 Host revision 对齐，不表示所有 IFC/Metro/Enterprise semantics 都已解析。\n\n## 19.8 Change Journal / DirtyMap\n'''
          if 'Freshness 与 Coverage/Maturity 严格分离' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          # SnapshotSet formal contract.
          old = '> 审批时看的是哪一份 Host revision、哪一份 semantic projection、哪一套 provider/mapping 环境。\n\n---\n\n# 21. D5 Read API\n'
          new = '''> 审批时看的是哪一份 Host revision、哪一份 semantic projection、哪一套 provider/mapping 环境。\n\n## 20.4 SnapshotSet\n\n跨 Host / 多文档 ChangeSet SHALL 通过 `SnapshotSet` 绑定一个或多个 PlanningSnapshot；单 Host MVP 也使用同一抽象。\n\n```text\nSnapshotSet\n  snapshot_set_id\n  kind: PLANNING\n  members[]:\n    document_ref\n    snapshot_id\n    snapshot_hash\n    base_host_revision\n    semantic_projection_ref\n    semantic_environment_ref\n  hash\n```\n\n任一 member 的 Host revision、snapshot/projection hash 或 pinned SemanticEnvironment 变化，SnapshotSet hash MUST 改变，并触发原 ChangeSet 重新验证或失效。\n\n---\n\n# 21. D5 Read API\n'''
          if '## 20.4 SnapshotSet' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          # LangGraph remains workflow owner.
          old = '但系统 eligibility 仍由结构化 term/schema/requirements 判断。\n\n---\n\n# 23. D6 — Parameter Binder\n'
          new = '''但系统 eligibility 仍由结构化 term/schema/requirements 判断。\n\n## 22.3 LangGraph / Orchestration Contract\n\n除非后续 ADR 替换编排框架，v0.6 继续沿用 v0.5：**LangGraph 是业务任务最终 workflow owner**。Semantic Service、D4、D5、D6、D7、Gateway、Provider Resolver 均为 deterministic service/node，不与 LangGraph 并行维护第二套最终 agent loop。\n\n```text\nResolveIntent\n→ ResolveHostContext\n→ EnsureContextFreshness\n→ ResolveOperations\n→ LLM OperationProposal\n→ ParameterBinding / InteractionSession\n→ EnsureOperationFreshness\n→ AnalyzeImpact / Propagation\n→ BuildChangeSet\n→ Preview / Policy / Approval\n→ ExecutionSlice[] / ExecutionUnit[]\n→ RevisionBarrier\n→ ProviderBinding / ExecutionGrant\n→ Apply\n→ Verify / Reconcile / ScopeCheck\n```\n\n长时间 Host interaction、semantic reconstruction 或 execution MUST 返回 session/job handle，并通过 checkpoint/resume 恢复，不得靠隐藏 MCP session 保存业务状态。\n\n---\n\n# 23. D6 — Parameter Binder\n'''
          if '## 22.3 LangGraph / Orchestration Contract' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          # InteractionSession belongs to deterministic parameter binding.
          old = '''## 23.3 BoundOperationProposal\n\n```text\noperation\narguments\nbinding_evidence\nsnapshot_ref\nsemantic_environment_ref\n```\n\n---\n\n# 24. D7 — ChangeSet / Approval / Execution\n'''
          new = '''## 23.3 BoundOperationProposal\n\n```text\noperation\narguments\nbinding_evidence\nsnapshot_ref\nsemantic_environment_ref\n```\n\n## 23.4 Host-native InteractionSession\n\n缺少必须由设计师在 Host Canvas 中提供的 typed input 时，D6 SHALL 创建显式 `InteractionSession`，不得让 LLM 猜 native id/坐标。\n\n```text\nInteractionSession\n  interaction_id / task_id / host_instance_id / document_id\n  interaction_type\n  input_constraints / result_schema\n  state: PENDING | COMPLETED | CANCELLED | EXPIRED\n  result? / created_at / expires_at\n```\n\n推荐类型：`SELECT_ENTITIES / PICK_POINT / PICK_DIRECTION / INPUT_NUMBER / CONFIRM / CANCEL`。`interaction.start` 重试 MUST 复用 idempotency_key，PENDING MUST 返回 typed `AsyncOperationRef`。\n\n---\n\n# 24. D7 — ChangeSet / Approval / Execution\n'''
          if '## 23.4 Host-native InteractionSession' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          # Restore D7 execution/governance contracts and correct ExecutionUnit regression.
          d7_start = s.index('# 24. D7 — ChangeSet / Approval / Execution')
          d7_end = s.index('# 25. “墙体加厚到 300mm”完整流程')
          d7 = '''# 24. D7 — ChangeSet / Approval / Execution\n\n## 24.1 ChangeSet\n\nChangeSet 是平台级、不可变的 canonical change，不属于任何单个 MCP Server，也不是 Host command 集合。至少绑定：`changeset_id / task_id / project_id / base_snapshot_set_id+hash / semantic_environment_ref / root_operations / derived_operations / preconditions / semantic_impacts / risk / approval_scope_boundary / verification / rollback / hash / status`。\n\n进入 Preview/Approval 后 ChangeSet SHOULD immutable；改变 canonical operation、targets、arguments、semantic effects 或 approved scope 必须创建新 ChangeSet。\n\n## 24.2 Impact / Dependency / Propagation\n\n平台 SHALL 区分：\n\n```text\nRelationship Graph      # A 与 B 有什么关系\nDependency Graph        # A 改了可能影响 B 吗\nConstraint Graph        # 修改后什么必须/应该成立\nChange Impact Graph     # 这次修改实际影响什么\nChange DAG              # 最终执行修改的因果结构\n```\n\nRelationship MUST NOT 直接等价为 Dependency。Dependency 至少表达 `HARD/SOFT/ADVISORY` 与 owner `HOST_NATIVE/SEMANTIC_RUNTIME/AGENT`。Propagation 至少支持 `AUTO_MUTATE/RECOMPUTE/REVALIDATE/MARK_DIRTY/REPLAN/BLOCK`。Metro/Enterprise Provider 可提供规则证据，但最终 Impact/Propagation 由平台 deterministic analyzer 形成。\n\n## 24.3 ApprovalScopeBoundary / SCOPE_BREACH\n\n用户批准的是 ChangeSet 披露的 effect boundary，不是 Host API 任意副作用。Boundary 至少表达 existing modifications、creation/deletion predicates、propagation bundles 与 execution-slice scopes。CREATE/COPY/OFFSET/SPLIT/ROUTE 不能只用旧 entity whitelist。\n\n执行后必须检查 `Host ActualDelta ⊆ ApprovalScopeBoundary`。不成立 MUST 返回 `SCOPE_BREACH`，停止尚未启动的 Slice，并进入安全回滚/补偿或新 ChangeSet + reapproval。\n\n## 24.4 ExecutionSlice\n\nExecution Planner 按 **Host instance + document + approved scope** 将 ChangeSet 分为 `ExecutionSlice[]`。Slice 不是 provider boundary；一个 Slice MAY 包含多个 ExecutionUnit，不同 Unit MAY 绑定不同 provider。\n\n```text\nExecutionSlice\n  execution_slice_id\n  changeset_id\n  host_instance_id\n  document_id\n  approved_scope_ref\n  execution_units[]\n  status\n```\n\n## 24.5 ExecutionUnit — 必须保持 canonical\n\nExecutionUnit 是最小 provider-binding 单位，但自身保持 provider-neutral：\n\n```text\nExecutionUnit\n  execution_unit_id\n  execution_slice_id\n  canonical_operation\n  targets[]            # SemanticId / canonical refs\n  arguments            # canonical units / terms\n  preconditions[]\n  expected_effects[]\n```\n\nExecutionUnit MUST NOT 包含 `provider_tool / Revit ElementId / AutoCAD Handle / Host internal units / native argument schema`。这些只能进入 ProviderBinding / HostCommand。\n\n## 24.6 ProviderBinding\n\nProviderBinding 只选择“谁来实现”和 canonical→provider schema adapter，不得改变 ChangeSet/ExecutionUnit 逻辑语义。包含 `binding_id / execution_unit_id / canonical_operation / provider_server / provider_tool / provider_version / host_instance_id / input_adapter_version / verification_contract / rollback_contract / binding_expires_at`。LLM 不参与 ProviderBinding。\n\n## 24.7 ApprovalToken → ApprovalRecord → ExecutionGrant\n\n```text\nApprovalToken\n  ↓ changeset.apply admission / consume once\nApprovalRecord\n  ↓ immutable durable approval fact\nExecutionSlice[] + ProviderBinding[]\n  ↓ binding_set_hash per Slice\nExecutionGrant[]\n  ↓ Host execution\n```\n\nApprovalRecord SHALL 绑定 `changeset_hash / approved_scope_hash / semantic_environment_hash / approver / policy_snapshot_hash`。ExecutionGrant SHALL 绑定 `approval_id / execution_slice_id / binding_set_hash / host_instance_id / approved_scope_hash / expiry`。ProviderBinding 仅替换 implementation 且 canonical semantics/scope 未变时，可基于同一 ApprovalRecord 重签 grant；语义或 scope 改变则必须新 ChangeSet + reapproval。\n\n## 24.8 RevisionBarrier / Idempotency\n\n每个目标 Host/document 执行前必须重新检查 revision/preconditions；冲突返回 `REVISION_CONFLICT` 并进入 reconstruct→revalidate→必要时 replan。`request_id` 表示 transport attempt；`idempotency_key` 表示逻辑 side effect。同一逻辑重试可换 request_id，但 MUST 复用 idempotency_key。\n\n## 24.9 Verification / Reconcile\n\nHost API `success=true` 不等于 semantic success。必须比较 expected semantic result、predicted scope、Host ActualDelta、ApprovalScopeBoundary，并用 ActualDelta 驱动 D5 dirty/reconstruct 与新 SemanticSnapshot。\n\n## 24.10 Cross-host Saga / Compensation\n\n跨 Host ChangeSet MUST 使用 Saga / compensating ChangeSet，不使用 XA/2PC。状态至少支持 `PARTIALLY_COMMITTED / COMPENSATING / ROLLED_BACK / FAILED`。某 Slice 不可恢复失败或 SCOPE_BREACH 后，未启动 Slice MUST 停止；补偿本身也必须可审计。\n\n---\n\n'''
          if '## 24.10 Cross-host Saga / Compensation' not in s[d7_start:d7_end]:
              s = s[:d7_start] + d7 + s[d7_end:]

          # Enterprise Gateway, envelope, error and threat model. Replace current thin section 29.
          sec29_start = s.index('# 29. Policy 与安全边界') if '# 29. Policy 与安全边界' in s else s.index('# 29. Policy、Enterprise Gateway 与安全边界')
          sec29_end = s.index('# 30. Repository Target Layout')
          sec29 = '''# 29. Policy、Enterprise Gateway 与安全边界\n\n## 29.1 Enterprise MCP Gateway\n\nSemantic MCP 不取代 Enterprise Gateway。Gateway 是治理入口：`AuthN/AuthZ / Policy / Routing / RateLimit / Approval+Grant enforcement / Audit / Trace / envelope validation`；Gateway MUST NOT 规划 CAD/BIM、保存 LangGraph workflow state、修改 Host/IFC、实现 native API 或替代 D5 semantic reasoning。\n\n```text\nAgent / Orchestrator\n        ↓\nEnterprise MCP Gateway\n        ↓\n  ┌──────────────┬──────────────┐\nSemantic MCP   Host MCP      Other Providers\n```\n\n## 29.2 写操作安全链\n\n```text\nCanonical eligibility\n→ Semantic Freshness + Coverage/Maturity + Assurance\n→ Policy\n→ PlanningSnapshot / SnapshotSet + pinned SemanticEnvironment\n→ ChangeSet + ApprovalScopeBoundary\n→ ApprovalToken → ApprovalRecord\n→ RevisionBarrier\n→ ProviderBinding + ExecutionGrant\n→ Idempotent Host execution\n→ Verify / Scope Comparator\n```\n\nLLM 不得跳过/降低这些要求，也不得选择 native id/provider tool、扩大 approved scope 或直接生成 Host API 调用。\n\n## 29.3 Runtime Envelope / Async Contract\n\n```text\nRequestEnvelope\n  request_id / task_id / project_id / actor_context / correlation_ids\n  deadline_at              # absolute timestamp\n  idempotency_key?         # side effect required\n  payload\n\nAsyncOperationRef\n  type: INTERACTION_SESSION | RECONSTRUCTION_JOB | EXECUTION_JOB | OTHER\n  id\n\nResponseEnvelope\n  request_id\n  status: OK | PENDING | ERROR\n  correlation_ids\n  snapshot_ref? / operation_ref? / result? / error?\n```\n\nchild deadline 不得晚于 parent；PENDING MUST 返回 typed AsyncOperationRef；跨请求恢复不得依赖隐藏 server session。\n\n## 29.4 Structured Error Model\n\n`ErrorShape = error_code + category(PROTOCOL|POLICY|SEMANTIC|EXECUTION|CONSISTENCY) + message + correlation_ids + retryable(IMMEDIATE|AFTER_RECONSTRUCT|AFTER_APPROVAL|NEVER) + details`。\n\n至少定义：`UNAUTHORIZED / SCHEMA_INVALID / CAPABILITY_FORBIDDEN / APPROVAL_REQUIRED / EXECUTION_GRANT_INVALID / PROVIDER_UNAVAILABLE / SEMANTIC_PROVIDER_UNAVAILABLE / SEMANTIC_ENVIRONMENT_MISMATCH / SEMANTIC_TERM_CONFLICT / MAPPING_AMBIGUOUS / FRESHNESS_INSUFFICIENT / ASSURANCE_INSUFFICIENT / SNAPSHOT_STALE / REVISION_CONFLICT / HOST_COMMAND_FAILED / INTERACTION_CANCELLED / VERIFY_FAILED / SCOPE_BREACH / SLICE_PARTIAL_FAILED`。自然语言 message 不得驱动程序化重试/补偿。\n\n## 29.5 Threat Model\n\n平台至少覆盖 prompt injection、恶意 Execution/Semantic Provider、capability escalation、replay/duplicate side effect、data exfiltration、本地越权。缓解包括 ChangeSet/Policy/Approval、provider certification+conformance、namespace authority、stable idempotency、数据分级/DLP/出网策略、Plugin↔Sidecar ACL/handshake。\n\n## 29.6 Degraded / Offline\n\nGateway 不可达时 Sidecar MAY 进入 `DEGRADED_LOCAL`：VIEW/CONTEXT/INTERACTION MAY 按本地 policy 继续；MODEL_OPERATION MUST NOT 执行。Semantic Runtime 或 required pinned SemanticEnvironment 不可用导致写操作 contract 不满足时，也不得 Apply。未来 offline write 必须单独 ADR + signed lease。\n\n## 29.7 Module Interaction Ownership\n\n关键 owner：Host native state/revision→Host；Snapshot/Projection→D5；SemanticEnvironment→Semantic Service；ResolvedOperation→D4；InteractionSession→Interaction Coordinator；ChangeSet→ChangeSet Store；ApprovalRecord/ExecutionGrant→Gateway；ExecutionSlice/Unit→Execution Planner；ProviderBinding→Provider Resolver；workflow checkpoint→LangGraph。跨服务不得通过共享内部数据库绕过 Contract。\n\n---\n\n'''
          s = s[:sec29_start] + sec29 + s[sec29_end:]

          # Extend conformance with restored runtime/governance coverage.
          marker = '安装/移除 mapping pack 仅改变 Provider/config，不改变 Collaboration Kernel 源码。\n'
          addition = '''\n## 31.5 Execution / Runtime Conformance\n\n必须保留：revision conflict / SnapshotSet invalidation；request_id vs idempotency_key；transaction abort no-half-commit；ActualDelta 完整性；verification contract；ProviderBinding 切换不改变 canonical semantics；binding_set_hash 改变使旧 Grant 失效；CREATE/DELETE + SCOPE_BREACH；multi-slice Saga；InteractionSession retry；PENDING→AsyncOperationRef；Phase A 不读取 EXACT、Phase B 按需升级；局部 coverage 不伪装 whole-document freshness。\n\n## 31.6 Observability / Audit\n\n全链路 SHOULD 传播 W3C TraceContext，并关联 `task_id / interaction_id / changeset_id / execution_slice_id / execution_unit_id / execution_id / command_id`。追加式事件至少包括 operation.resolved、semantic.term.resolved、semantic.mapping.applied、semantic.environment.pinned、semantic.projection.published、freshness.enforced、changeset.built、approval、provider.bound、execution.grant、apply、verify、scope breach、compensation、policy.denied。\n\n## 31.7 Performance Baseline\n\n恢复 v0.5 初始 SHOULD：单文档参考规模 ≤50k entities；单任务 affected ≤500；Operation Resolver p95≤300ms（cache≤50ms）；Freshness barrier（geometry≤APPROXIMATE, depth≤2）p95≤5s；Gateway routing/policy p95≤20ms。\n\n## 31.8 Version / Compatibility\n\n同时版本化 HostContract major.minor、CanonicalOperation id/version、SemanticProvider version+content_hash、SemanticEnvironment immutable provider/version/hash set。Provider tool 增删不得直接改变 LLM action contract；CanonicalOperation major 语义变化必须注册新 id。\n\n## 31.9 Deployment Topology\n\nWorkstation：Host Plugin + Sidecar/Host MCP。Enterprise trust domain：Gateway + Registry/Policy + Semantic Service/MCP + D5 Runtime/Snapshot/Journal + ChangeSet/Approval/Audit stores。Semantic Providers 可 in-process/MCP/file/database adapter。\n'''
          pos = s.index('# 31. Conformance 与测试')
          end = s.index('# 32. Migration from v0.5 / current branch')
          if '## 31.5 Execution / Runtime Conformance' not in s[pos:end]:
              i = s.index(marker, pos, end) + len(marker)
              s = s[:i] + addition + s[i:]

          # Migration section: v0.5 contracts are preserved, not discarded.
          old = '''当前 D5 中以下概念继续有效：\n\n```text\nChangeJournal\nDirtyMap\nFreshnessState\nFreshnessContract\nCoverage\nAspectRequirement\nAspectGuarantee\nContextSnapshot / PlanningSnapshot\nSnapshotSet\nrevision / coverage / guarantee barriers\n```\n'''
          new = '''v0.5 中以下已冻结 Runtime / Governance contract 继续有效，并在 v0.6 语义架构上扩展：\n\n```text\nChangeJournal / DirtyMap / FreshnessState / FreshnessContract\nCoverage / AspectRequirement / AspectGuarantee\nContextSnapshot / PlanningSnapshot / SnapshotSet\nrevision / coverage / guarantee barriers\nExecutionSlice / canonical ExecutionUnit / ProviderBinding\nApprovalScopeBoundary / ApprovalToken / ApprovalRecord / ExecutionGrant\nInteractionSession / AsyncOperationRef\nRequestEnvelope / ResponseEnvelope / ErrorShape\nDependency / Constraint / Impact / Propagation separation\nSaga / Compensating ChangeSet\nEnterprise Gateway governance\nAudit / Trace / Version / Deployment contracts\n```\n'''
          if old in s:
              s = s.replace(old, new, 1)

          # Implementation sequence.
          s = s.replace('  6. ProjectionRef / EnvironmentRef\n', '  6. Progressive Semantic Model / Geometry Fidelity\n  7. ProjectionRef / EnvironmentRef / SnapshotSet\n', 1)
          phase_c = s.index('Phase C — Semantic Service')
          phase_end = s.index('```', phase_c)
          block = s[phase_c:phase_end]
          if 'Phase F — Runtime / Governance Restoration' not in block:
              block = block.replace('Phase C — Semantic Service\n  7.', 'Phase C — Semantic Service\n  8.').replace('\n  8. Semantic Registry', '\n  9. Semantic Registry').replace('\n  9. Semantic MCP', '\n  10. Semantic MCP').replace('\n  10. environment', '\n  11. environment')
              block = block.replace('Phase D — Reference Providers\n  11.', 'Phase D — Reference Providers\n  12.').replace('\n  12. IFC4.3', '\n  13. IFC4.3').replace('\n  13. Metro', '\n  14. Metro')
              block = block.replace('Phase E — Ingestion Proof\n  14.', 'Phase E — Ingestion Proof\n  15.').replace('\n  15. AutoCAD', '\n  16. AutoCAD').replace('\n  16. fake', '\n  17. fake').replace('\n  17. prove', '\n  18. prove')
              old_f = '''Phase F — Action / Binding / ChangeSet\n  18. Canonical Action contract upgrade\n  19. D4 semantic eligibility\n  20. D6 Slot Binder\n  21. D7 ChangeSet / ProviderBinding / verification\n'''
              new_f = '''Phase F — Runtime / Governance Restoration\n  19. Enterprise Gateway / Envelope / Error contracts\n  20. InteractionSession / AsyncOperationRef\n  21. Dependency / Impact / Propagation contracts\n  22. ApprovalScopeBoundary / Approval chain / Saga\n\nPhase G — Action / Binding / ChangeSet\n  23. Canonical Action contract upgrade\n  24. D4 semantic eligibility\n  25. D6 Slot Binder\n  26. D7 ExecutionSlice / canonical ExecutionUnit / ProviderBinding / verification\n'''
              block = block.replace(old_f, new_f)
              s = s[:phase_c] + block + s[phase_end:]

          # Architecture invariants.
          old = '12. 高风险 operation 在 freshness / assurance 不满足时 fail closed。\n'
          new = '''12. 高风险 operation 在 freshness / assurance 不满足时 fail closed。\n13. Freshness 不等于 semantic completeness；Coverage/Maturity 与 Freshness 分离。\n14. Geometry Fidelity 按 NONE→BOUNDS→APPROXIMATE→EXACT→NATIVE 渐进提升。\n15. ExecutionUnit 保持 canonical/provider-neutral；provider/native schema 仅存在于 ProviderBinding/HostCommand。\n16. ChangeSet 跨 Host 通过 ExecutionSlice 分割；失败采用 Saga/Compensating ChangeSet。\n17. ActualDelta 超出 ApprovalScopeBoundary 必须 SCOPE_BREACH 并停止后续 Slice。\n18. Gateway 是治理入口；Semantic MCP 是语义入口，两者不得互相替代。\n19. request_id 与 idempotency_key 分离；PENDING 必须返回 typed AsyncOperationRef。\n20. Safety decisions 由 structured policy/contract/error 驱动，不由 description/LLM 自由文本驱动。\n'''
          if '13. Freshness 不等于 semantic completeness' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          # Glossary and freeze conditions.
          s = s.replace('| Freshness | semantic fact 相对于 Host revision 的新鲜状态 |', '| Progressive Semantic Model | 按任务逐 aspect 提升 Semantic Depth / Geometry Fidelity，而非维护全量实时语义镜像 |\n| Semantic Coverage / Maturity | 当前已解析/理解哪些 aspect、term、domain 层级 |\n| Geometry Fidelity | NONE / BOUNDS / APPROXIMATE / EXACT / NATIVE 几何证据等级 |\n| Freshness | semantic fact 相对于 Host revision 的新鲜状态；不等于 semantic completeness |', 1)
          s = s.replace('| ProviderBinding | Canonical target/argument 到 Host provider-native 输入的确定性转换 |', '| ExecutionSlice | ChangeSet 面向单一 Host/document/approved-scope 的执行分片 |\n| ExecutionUnit | Slice 内最小 provider-binding 单位，保持 canonical/provider-neutral |\n| ApprovalScopeBoundary | Preview/Approval 已披露并允许的 effect predicates 边界 |\n| SCOPE_BREACH | ActualDelta 超出 approved effect boundary 的阻断型错误 |\n| ApprovalRecord | 持久不可变批准事实 |\n| ExecutionGrant | 针对单个 ExecutionSlice + binding_set_hash 的短生命周期授权 |\n| ProviderBinding | Canonical target/argument 到 Host provider-native 输入的确定性转换 |', 1)

          freeze = '12. Metro reference case 通过 Schema / PsetProj / IDS / mapping / provenance 全链路验证。\n'
          if '13. Progressive Semantic Model 的 Semantic Depth' not in s:
              assert freeze in s
              s = s.replace(freeze, freeze + '''13. Progressive Semantic Model 的 Semantic Depth / Coverage / Geometry Fidelity / Freshness / Assurance 边界冻结。\n14. ExecutionSlice / canonical ExecutionUnit / ProviderBinding 三层执行边界冻结。\n15. ApprovalToken → ApprovalRecord → ExecutionGrant 与 ApprovalScopeBoundary / SCOPE_BREACH 冻结。\n16. Enterprise Gateway 与 Semantic MCP 的治理/语义职责边界冻结。\n17. RequestEnvelope / ErrorShape / AsyncOperationRef / idempotency 契约恢复并通过 conformance。\n18. Dependency / Constraint / ChangeImpact / Propagation 边界恢复并通过 reference case。\n''', 1)

          old = '''Host MCP        = 怎么做\nSemantic MCP    = 是什么 / 规则是什么\nD5              = 当前设计是什么\nCanonical Action= 允许表达什么动作\nD6              = 这次动作的参数具体是什么\nD7              = 准备执行、审批、绑定和验证什么\nLLM             = 在受约束空间中理解意图，不拥有系统真相和执行权\n'''
          new = '''Enterprise Gateway = 谁能做、在什么范围内做、如何授权与审计\nHost MCP           = 怎么做\nSemantic MCP       = 是什么 / 规则是什么\nD5                 = 当前设计是什么，以及当前理解覆盖/新鲜度/可信度到什么程度\nCanonical Action   = 允许表达什么动作\nD6                 = 这次动作的参数具体是什么；缺少 Host-native 输入时创建 InteractionSession\nD7                 = 影响分析、ChangeSet、执行分片、审批范围、绑定、执行与验证\nLLM                = 在受约束空间中理解意图，不拥有系统真相、授权权或执行权\n'''
          if old in s:
              s = s.replace(old, new, 1)

          # Sanity checks before writing.
          required = [
              '## 2.6 Progressive Semantic Model',
              '## 20.4 SnapshotSet',
              '## 22.3 LangGraph / Orchestration Contract',
              '## 24.4 ExecutionSlice',
              '## 24.5 ExecutionUnit — 必须保持 canonical',
              '## 24.7 ApprovalToken → ApprovalRecord → ExecutionGrant',
              'SCOPE_BREACH',
              '## 29.1 Enterprise MCP Gateway',
              'RequestEnvelope',
              'ErrorShape',
              '## 31.5 Execution / Runtime Conformance',
          ]
          for item in required:
              assert item in s, item
          assert 'ExecutionUnit 是 Host/provider-specific' not in s
          p.write_text(s, encoding='utf-8')
          PY

