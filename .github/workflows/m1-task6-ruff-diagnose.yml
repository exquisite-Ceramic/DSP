name: M1 Task 6 Ruff diagnosis

on:
  push:
    branches:
      - feat/technology-modernization-m1

# 临时诊断：展示 Ruff 对 import block 的确定性修复 diff；定位后立即删除。
permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the same Ruff version pinned by uv.lock
        run: python -m pip install ruff==0.16.7
      - name: Show deterministic import fix
        run: ruff check --select I --fix --diff tests/architecture/test_modernization_dotnet_toolchain.py
      - name: Show remaining E/F diagnostics
        run: ruff check --select E,F tests/architecture/test_modernization_dotnet_toolchain.py
