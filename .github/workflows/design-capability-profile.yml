name: Design capability profile verification

on:
  pull_request:
    paths:
      - 'hosts/autocad/sidecar/**'
      - 'tests/integration/test_design_capability_profile.py'
      - '.github/workflows/design-capability-profile.yml'
  workflow_dispatch:

jobs:
  capability-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install repository verification stack from committed lock
        run: |
          # capability lane 与 Repository Regression 共用 committed uv.lock，避免手工 pip 子集遗漏测试依赖与 workspace 包。
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run capability profile tests
        run: uv run python -m pytest -q tests/integration/test_design_capability_profile.py
      - name: Run full Python regression tests
        run: uv run python -m pytest -q contracts/python/tests tests/contracts tests/integration
