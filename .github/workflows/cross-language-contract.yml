name: Cross-language contract compatibility

on:
  push:
    branches:
      - test/cross-language-contract-interop
  pull_request:
    paths:
      - "contracts/python/**"
      - "contracts/dotnet/**"
      - "tests/contracts/test_cross_language_compatibility.py"
      - "tests/contracts/dotnet_interop/**"
      - ".github/workflows/cross-language-contract.yml"

jobs:
  contract-interop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run bidirectional contract compatibility tests
        run: pytest -q tests/contracts/test_cross_language_compatibility.py
