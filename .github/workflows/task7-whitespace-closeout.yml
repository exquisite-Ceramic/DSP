name: Task7 whitespace closeout

on:
  push:
    branches:
      - work/task7-standard-ci-clean-verify
    paths:
      - ".github/workflows/task7-whitespace-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove inherited trailing whitespace only
        run: |
          python - <<'PY'
          from pathlib import Path

          # 仅清理 Step36 `git diff --check` 已明确报告的两份 Task 7 文档。
          # 不改正文内容、不新增标记，只移除每一行行尾空白字符。
          paths = (
              Path("docs/superpowers/plans/2026-09-25-revit-wall-thickness-product-vertical.md"),
              Path("docs/superpowers/specs/2026-09-25-revit-wall-thickness-product-vertical-design.md"),
          )
          for path in paths:
              text = path.read_text(encoding="utf-8")
              cleaned = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
              path.write_text(cleaned, encoding="utf-8")
          PY
          git diff --check
          git diff --check origin/main...HEAD || true
      - name: Commit source-only whitespace fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/superpowers/plans/2026-09-25-revit-wall-thickness-product-vertical.md \
            docs/superpowers/specs/2026-09-25-revit-wall-thickness-product-vertical-design.md
          git diff --cached --check
          git commit -m "chore: clear Task 7 document whitespace"
          git push origin HEAD:work/task7-standard-ci-clean-verify
