name: Task 6R.2 focused green

on:
  push:
    branches:
      - diag/task6r2-focused-green

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install repository verification stack from committed lock
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run Task 6R.2 focused pytest
        run: |
          uv run pytest \
            tests/orchestrator/test_canonical_owner_ports.py \
            tests/architecture/test_real_owner_workflow_boundaries.py -q
      - name: Run Task 6R.2 focused Ruff
        continue-on-error: true
        run: |
          uv run ruff check \
            platform/orchestrator/src/design_orchestrator/canonical_owner_ports.py \
            tests/orchestrator/test_canonical_owner_ports.py \
            tests/architecture/test_real_owner_workflow_boundaries.py
