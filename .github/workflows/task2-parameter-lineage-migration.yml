name: Task 2 parameter lineage migration helper

on:
  push:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply exact Task 2 seam migration
        run: python .github/scripts/task2_parameter_lineage_migrate.py
      - name: Commit migrated seam on feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: bind workflow parameters to explicit task lineage"
          git push origin HEAD:feature/revit-wall-thickness-product-vertical
