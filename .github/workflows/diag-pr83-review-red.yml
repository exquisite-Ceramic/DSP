name: PR83 review RED

on:
  push:
    branches:
      - diag/pr83-review-red-6acd1d94

jobs:
  verify-review-fixes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 099e4e78476d370b39472fcad050ec5c3ac343f7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install repository verification stack from committed lock
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Verify reviewer regression tests
        run: |
          uv run python -m pytest \
            tests/product_front_door/test_agent.py \
            tests/product_front_door/test_composition_pool.py -q -vv
          uv run ruff check --select E,F,I \
            platform/product_front_door/src/design_product_front_door/agent.py \
            platform/product_front_door/src/design_product_front_door/composition_pool.py \
            tests/product_front_door/test_agent.py \
            tests/product_front_door/test_composition_pool.py
      - name: Verify source-only external-script bootstrap and fresh SQLite initialization
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/front-door-bootstrap-smoke.py" <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from design_product_front_door import (
              SqliteFrontDoorStateStore,
              SqliteSessionBindingReader,
          )
          from design_product_runtime import ProductTaskQueryService

          assert ProductTaskQueryService is not None
          with TemporaryDirectory() as directory:
              database_path = str(Path(directory) / "fresh-front-door.sqlite3")
              initializer = SqliteFrontDoorStateStore(database_path)
              initializer.close()
              reader = SqliteSessionBindingReader(database_path)
              reader.close()
          PY
          export PYTHONPATH="$(pwd)/platform/product_front_door/src:$(pwd)/platform/product_runtime/src:$(pwd)/platform/interaction/src:$(pwd)/platform/impact/src:$(pwd)/platform/approval_scope/src"
          uv run python "$RUNNER_TEMP/front-door-bootstrap-smoke.py"
