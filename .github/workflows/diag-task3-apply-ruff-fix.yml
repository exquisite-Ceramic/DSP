name: Diagnostic apply Task3 Ruff fix

on:
  push:
    branches:
      - "diag/task3-ruff-import-canonical"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-exact-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "feat/capability-real-owner-e2e-workflow"
          fetch-depth: 0
      - name: Lock exact feature HEAD
        run: |
          test "$(git rev-parse HEAD)" = "ff222316558ed0721ab6328c375028690c8a0eb7"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install exact Ruff
        run: python -m pip install ruff==0.16.8
      - name: Apply and verify canonical import fix
        run: |
          ruff check --select I --fix tests/orchestrator/test_real_owner_reference_resolution.py
          ruff check --select I tests/orchestrator/test_real_owner_reference_resolution.py
          git diff --check
          test "$(git diff --name-only)" = "tests/orchestrator/test_real_owner_reference_resolution.py"
          git diff -- tests/orchestrator/test_real_owner_reference_resolution.py
      - name: Commit exact fix to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/orchestrator/test_real_owner_reference_resolution.py
          git commit -m "style: fix Task 3 import ordering"
          git push origin HEAD:refs/heads/feat/capability-real-owner-e2e-workflow
