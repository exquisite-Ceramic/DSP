name: Task 8 import fix d1706d6c

on:
  push:
    branches:
      - diag/task8-import-fix-d1706d6c

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d1706d6c543a65cb58ce08b1e6645c17e99c2799
          fetch-depth: 0

      - name: Assert exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "d1706d6c543a65cb58ce08b1e6645c17e99c2799"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install committed verification stack
        shell: bash
        run: |
          python -m pip install uv
          uv sync --locked --all-packages

      - name: Run focused tests
        shell: bash
        run: |
          uv run pytest \
            tests/product_front_door/test_mcp_client.py \
            tests/product_front_door/test_reference_client.py \
            -q -vv

      - name: Run scoped Ruff
        shell: bash
        run: |
          uv run ruff check \
            platform/product_front_door/src/design_product_front_door/mcp_client.py \
            platform/product_front_door/src/design_product_front_door/reference_client.py \
            platform/product_front_door/src/design_product_front_door/__init__.py \
            tests/product_front_door/test_mcp_client.py \
            tests/product_front_door/test_reference_client.py
