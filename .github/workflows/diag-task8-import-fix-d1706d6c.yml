name: Task 8 import diff d1706d6c

on:
  push:
    branches:
      - diag/task8-import-fix-d1706d6c

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d1706d6c543a65cb58ce08b1e6645c17e99c2799
          fetch-depth: 0

      - name: Assert exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "d1706d6c543a65cb58ce08b1e6645c17e99c2799"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install committed verification stack
        shell: bash
        run: |
          python -m pip install uv
          uv sync --locked --all-packages

      - name: Show Ruff canonical import diff
        shell: bash
        run: uv run ruff check --fix --diff tests/product_front_door/test_mcp_client.py
