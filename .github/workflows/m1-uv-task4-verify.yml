name: M1 Task 4 uv verification

on:
  push:
    branches:
      - feat/technology-modernization-m1

# 这是 Task 4 的临时验证工作流：只验证冻结计划中的 locked-environment 命令。
# 验证完成后删除；canonical CI 切换到 uv 属于 Task 5。
permissions:
  contents: read

jobs:
  verify-locked-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Verify lock is current
        run: uv lock --check
      - name: Reconstruct complete workspace from lock
        run: uv sync --locked --all-packages
      - name: Run canonical importlib regression through uv
        run: uv run python -m pytest --import-mode=importlib -q
      - name: Run canonical local-parity regression through uv
        run: uv run python -m pytest -q
      - name: Run focused M1 workspace contract
        run: uv run python -m pytest tests/architecture/test_modernization_workspace.py -q
