name: Diagnostic Task3 Ruff import

on:
  push:
    branches:
      - "diag/task3-ruff-import-canonical"
  workflow_dispatch:

jobs:
  ruff-import-canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install exact Ruff
        run: python -m pip install ruff==0.16.8
      - name: Show effective Ruff settings
        run: ruff check --show-settings tests/orchestrator/test_real_owner_reference_resolution.py
      - name: Show canonical I001 fix diff
        run: |
          ruff --version
          ruff check --select I --fix --diff tests/orchestrator/test_real_owner_reference_resolution.py || true
