name: Task 2 exact-head verification

on:
  push:

permissions:
  contents: write

jobs:
  verify-final-tree:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dsp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      AGENT_HOST_TEST: "0"
      DSP_PHASE_I_LIVE: "0"
      DSP_REVIT_LIVE: "0"
      DSP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/dsp_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Materialize the final helper-free Task 2 commit before verification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/task2-exact-head-verification.yml
          git add -A
          git commit -m "chore: finalize Task 2 exact-head verification"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Verifying final SHA $(git rev-parse HEAD) before push"
      - name: Install exact locked verification stack
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run Task 2 focused seam and migration tests
        run: |
          uv run pytest \
            tests/orchestrator/test_task2_parameter_binding_task_lineage.py \
            tests/orchestrator/test_default_workflow_services.py \
            tests/orchestrator/test_langgraph_graph.py \
            tests/orchestrator/test_canonical_owner_ports.py \
            tests/orchestrator/test_hitl_resume_observability.py \
            tests/orchestrator/test_langgraph_runtime.py \
            tests/orchestrator/test_legacy_hitl_migration.py \
            tests/orchestrator/test_legacy_hitl_resume_observability.py \
            tests/orchestrator/test_postgres_checkpoint.py \
            tests/orchestrator/test_task6_review_regressions.py \
            tests/orchestrator/test_task9_parameter_binding_context_validation.py \
            tests/orchestrator/test_v2_hitl_artifact_validation.py -q
      - name: Run full orchestrator suite with PostgreSQL 17
        run: uv run pytest tests/orchestrator -q
      - name: Run repository importlib regression on the final SHA
        run: uv run python -m pytest --import-mode=importlib -q
      - name: Run repository local-parity regression on the final SHA
        run: uv run python -m pytest -q
      - name: Enforce Task 2 no-new Ruff diagnostics against pre-Task-2 GREEN
        shell: bash
        run: |
          BASE_SHA=361cf36ad86b549df78d36c9236c0da55ba6284c
          git worktree add /tmp/task2-base "$BASE_SHA"
          RUFF_BIN="$GITHUB_WORKSPACE/.venv/bin/ruff"
          (
            cd /tmp/task2-base
            "$RUFF_BIN" check --select E,F,I --output-format=json \
              platform/orchestrator tests/orchestrator > /tmp/task2-base-ruff.json || true
          )
          "$RUFF_BIN" check --select E,F,I --output-format=json \
            platform/orchestrator tests/orchestrator > /tmp/task2-head-ruff.json || true
          uv run python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          def diagnostics(path: str) -> Counter[tuple[str, str, str]]:
              rows = json.loads(Path(path).read_text(encoding="utf-8"))
              result: Counter[tuple[str, str, str]] = Counter()
              for row in rows:
                  filename = str(row["filename"]).replace("\\", "/")
                  for marker in ("/platform/", "/tests/"):
                      if marker in filename:
                          filename = marker.strip("/") + "/" + filename.split(marker, 1)[1]
                          break
                  result[(filename, row["code"], row["message"])] += 1
              return result

          base = diagnostics("/tmp/task2-base-ruff.json")
          head = diagnostics("/tmp/task2-head-ruff.json")
          added = head - base
          print(f"base diagnostics: {sum(base.values())}")
          print(f"head diagnostics: {sum(head.values())}")
          print(f"new diagnostics: {sum(added.values())}")
          for item, count in sorted(added.items()):
              print("NEW", count, item)
          if added:
              sys.exit(1)
          PY
      - name: Push only the exact commit that passed every gate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/revit-wall-thickness-product-vertical
