name: Semantic MCP verification

on:
  push:
    branches:
      - main
      - 'feat/semantic-mcp-adapter'
    paths:
      - 'platform/semantic_mcp/**'
      - 'tests/semantic_mcp/**'
      - 'docs/superpowers/specs/2026-08-28-semantic-mcp-adapter-design.md'
      - 'docs/superpowers/plans/2026-08-28-semantic-mcp-adapter.md'
      - '.github/workflows/semantic-mcp.yml'
  pull_request:
    paths:
      - 'platform/semantic_mcp/**'
      - 'tests/semantic_mcp/**'
      - 'docs/superpowers/specs/2026-08-28-semantic-mcp-adapter-design.md'
      - 'docs/superpowers/plans/2026-08-28-semantic-mcp-adapter.md'
      - '.github/workflows/semantic-mcp.yml'
  workflow_dispatch:

jobs:
  semantic-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install RED-test dependencies
        run: python -m pip install pytest
      - name: Run Semantic MCP architecture RED test
        run: pytest -q tests/semantic_mcp/test_architecture.py
