name: Task 5 exact-head verification

on:
  push:
    branches:
      - diag/task5-exact-head-verification-0ce8276

jobs:
  task5-exact-head:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dsp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DSP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/dsp_test
    steps:
      - name: Checkout exact Task 5 feature head
        uses: actions/checkout@v7
        with:
          ref: 0ce82762841825c107ccf5bdbe241ab123718072
          fetch-depth: 0

      - name: Assert exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0ce82762841825c107ccf5bdbe241ab123718072"

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install committed verification stack
        shell: bash
        run: |
          python -m pip install uv
          uv sync --locked --all-packages

      - name: Run Task 5 focused PostgreSQL and denial acceptance
        shell: bash
        run: |
          uv run pytest \
            tests/product_front_door/test_approval_policy.py \
            tests/product_front_door/test_approval_admission_postgres.py \
            tests/gateway_authorization \
            tests/orchestrator/test_real_owner_workflow_end_to_end.py \
            tests/orchestrator/test_configured_policy_denial_e2e.py \
            -q -vv

      - name: Check Task 5 touched paths with Ruff
        shell: bash
        run: |
          uv run ruff check \
            platform/product_front_door/src/design_product_front_door \
            platform/gateway_authorization/src/design_gateway_authorization \
            platform/orchestrator/src/design_orchestrator/canonical_owner_ports.py \
            tests/product_front_door \
            tests/gateway_authorization \
            tests/orchestrator/test_real_owner_workflow_end_to_end.py \
            tests/orchestrator/test_configured_policy_denial_e2e.py

      - name: Verify repository diff whitespace
        shell: bash
        run: |
          git fetch origin main --no-tags
          git diff --check origin/main...HEAD
