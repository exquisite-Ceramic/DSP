name: M3 Task 9 schema resolver verify

on:
  push:
    branches:
      - feat/technology-modernization-m1

jobs:
  focused-schema-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild locked verification environment
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Confirm deprecated resolver is absent from the frozen validation path
        shell: bash
        run: |
          if git grep -n RefResolver -- contracts/python/tests/test_normalized_design_fact_schema.py; then
            echo "deprecated RefResolver remains in the frozen Task 9 validation path" >&2
            exit 1
          fi
      - name: Run focused schema resolution contract
        run: |
          uv run python -m pytest \
            contracts/python/tests/test_normalized_design_fact_schema.py \
            tests/architecture/test_modernization_schema_resolution.py \
            -q
      - name: Run absolute Ruff on Task 9 files
        run: |
          uv run ruff check --select E,F,I \
            contracts/python/tests/test_normalized_design_fact_schema.py \
            tests/architecture/test_modernization_schema_resolution.py
