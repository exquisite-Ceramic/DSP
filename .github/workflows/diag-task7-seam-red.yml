name: Task7 seam RED diagnostic

on:
  push:
    branches:
      - diag/task7-real-owner-red

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diag/task7-real-owner-red
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install repository verification stack from committed lock
        run: |
          # 与 repository-regression 使用同一份 committed uv.lock，避免诊断环境漂移。
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run focused Task7 seam RED
        run: >-
          uv run pytest tests/orchestrator/test_canonical_owner_ports.py -q
          -k task7_seam_carries_authorization_store_clock_and_grant_lineage
