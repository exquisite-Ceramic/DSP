name: Task7 seam RED diagnostic

on:
  push:
    branches:
      - diag/task7-real-owner-red

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diag/task7-real-owner-red
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Add Task7 seam RED test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/orchestrator/test_canonical_owner_ports.py")
          text = path.read_text()
          marker = "def test_canonical_owner_ports_import_smoke_blocks_database_and_test_imports() -> None:\n"
          test = '''def test_task7_seam_carries_authorization_store_clock_and_grant_lineage() -> None:\n    \"\"\"Task 7 必须显式携带授权 owner、时钟与 grant 所需的全部 StableRef。\"\"\"\n\n    from design_orchestrator.canonical_owner_ports import CanonicalWorkflowOwnerPorts\n    from design_orchestrator.workflow_services import WorkflowServices\n\n    constructor = inspect.signature(CanonicalWorkflowOwnerPorts)\n    assert \"gateway_authorization_store\" in constructor.parameters\n    assert \"coordination_clock\" in constructor.parameters\n\n    expected_grant_parameters = (\n        \"self\",\n        \"execution_plan_ref\",\n        \"approval_ref\",\n        \"provider_binding_ref\",\n    )\n    for owner_type in (\n        WorkflowServices,\n        ExternalOwnerPorts,\n        DefaultWorkflowServices,\n        CanonicalWorkflowOwnerPorts,\n    ):\n        parameters = tuple(\n            inspect.signature(owner_type.issue_execution_grant).parameters\n        )\n        assert parameters == expected_grant_parameters\n\n\n'''
          if "test_task7_seam_carries_authorization_store_clock_and_grant_lineage" not in text:
              text = text.replace(marker, test + marker)
              path.write_text(text)
          PY
      - name: Install focused test dependencies
        run: python -m pip install -r requirements-ci.lock
      - name: Run focused Task7 seam RED
        run: pytest tests/orchestrator/test_canonical_owner_ports.py -q -k task7_seam_carries_authorization_store_clock_and_grant_lineage
      - name: Commit RED test blob
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/orchestrator/test_canonical_owner_ports.py
          git commit -m "test: add Task7 composition seam RED"
          git push origin HEAD:diag/task7-real-owner-red
