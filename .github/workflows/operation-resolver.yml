name: Operation resolver verification

on:
  push:
    branches:
      - 'feat/operation-resolver'
    paths:
      - 'platform/orchestrator/**'
      - 'tests/orchestrator/**'
      - 'pyproject.toml'
      - '.github/workflows/operation-resolver.yml'
  pull_request:
    paths:
      - 'platform/orchestrator/**'
      - 'tests/orchestrator/**'
      - 'pyproject.toml'
      - '.github/workflows/operation-resolver.yml'
  workflow_dispatch:

jobs:
  operation-resolver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          python -m pip install pytest pytest-asyncio jsonschema
          python -m pip install -e contracts/python -e hosts/autocad/sidecar
      - name: Run D4 operation resolver tests
        run: pytest -q tests/orchestrator/test_operation_resolver.py
      - name: Run full Python regression tests
        run: pytest -q contracts/python/tests tests/contracts tests/integration tests/orchestrator
