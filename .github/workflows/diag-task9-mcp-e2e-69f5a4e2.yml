name: Task 9 MCP E2E 69f5a4e2

on:
  push:
    branches:
      - diag/task9-mcp-e2e-69f5a4e2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dsp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DSP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/dsp_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 69f5a4e26c280dcacd6ef8a295bc158a52379681
          fetch-depth: 0
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "69f5a4e26c280dcacd6ef8a295bc158a52379681"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install committed verification stack
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run Task 9 real MCP acceptance
        run: uv run pytest tests/product_front_door/test_mcp_product_end_to_end.py -q -vv
      - name: Run Task 9 MCP acceptance Ruff
        run: uv run ruff check tests/product_front_door/test_mcp_product_end_to_end.py
