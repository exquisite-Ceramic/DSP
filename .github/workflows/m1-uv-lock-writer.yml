name: M1 uv lock writer

on:
  push:
    branches:
      - feat/technology-modernization-m1

# Task 4 临时 lock writer：根 manifest 变化后由真实 uv resolver 重写并校验 uv.lock。
# 写回完成后删除；不得作为 canonical CI 长期入口。
permissions:
  contents: write

jobs:
  write-lock:
    # 防止 bot 写回 lock 后递归提交。
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/technology-modernization-m1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv resolver
        run: python -m pip install uv
      - name: Regenerate and validate lock
        run: |
          uv lock
          uv lock --check
      - name: Commit updated uv.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh Python workspace lock"
          git push origin HEAD:feat/technology-modernization-m1
