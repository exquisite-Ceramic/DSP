name: Repository regression

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  AGENT_HOST_TEST: "0"
  DSP_PHASE_I_LIVE: "0"
  DSP_REVIT_LIVE: "0"

jobs:
  python-regression:
    name: Python ${{ matrix.python-version }} (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            lane: canonical
          - python-version: "3.14"
            lane: compatibility
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install repository verification stack from committed lock
        run: |
          # uv 本身是 bootstrap 工具；两个 Python lane 都从同一份 committed uv.lock 重建 workspace。
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run repository importlib regression
        run: uv run python -m pytest --import-mode=importlib -q
      - name: Run repository local-parity regression
        run: uv run python -m pytest -q
      - name: Enforce no new repository Ruff diagnostics
        # Python 3.11 仍是 canonical lane；3.14 只证明运行时兼容性，不复制 Ruff baseline ownership。
        if: matrix.lane == 'canonical'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git worktree add /tmp/dsp-base "$BASE_SHA"

          # base/head 必须使用 HEAD committed lock 中的同一个 Ruff 二进制，避免历史环境差异污染 delta。
          RUFF_BIN="$GITHUB_WORKSPACE/.venv/bin/ruff"
          (
            cd /tmp/dsp-base
            "$RUFF_BIN" check --select E,F,I --output-format=json platform hosts/autocad/sidecar tests > /tmp/base-ruff.json || true
          )
          "$RUFF_BIN" check --select E,F,I --output-format=json platform hosts/autocad/sidecar tests > /tmp/head-ruff.json || true
          uv run python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          def diagnostics(path: str) -> Counter[tuple[str, str, str]]:
              rows = json.loads(Path(path).read_text(encoding="utf-8"))
              result: Counter[tuple[str, str, str]] = Counter()
              for row in rows:
                  filename = str(row["filename"]).replace("\\", "/")
                  for marker in ("/platform/", "/hosts/", "/tests/"):
                      if marker in filename:
                          filename = marker.strip("/") + "/" + filename.split(marker, 1)[1]
                          break
                  result[(filename, row["code"], row["message"])] += 1
              return result

          base = diagnostics("/tmp/base-ruff.json")
          head = diagnostics("/tmp/head-ruff.json")
          added = head - base
          print(f"base diagnostics: {sum(base.values())}")
          print(f"head diagnostics: {sum(head.values())}")
          print(f"new diagnostics: {sum(added.values())}")
          for item, count in sorted(added.items()):
              print("NEW", count, item)
          if added:
              sys.exit(1)
          PY

  revit-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run Revit AgentHost Core regression
        run: dotnet test hosts/revit/plugin/Revit.AgentHost.Core.Tests/Revit.AgentHost.Core.Tests.csproj -f net8.0

  dotnet10-compat:
    name: .NET 10 (Host-neutral compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Host-neutral Revit Core .NET 10 compatibility
        shell: bash
        run: |
          # 根 global.json 继续拥有 canonical 8.x SDK policy。
          # compatibility lane 只在 Revit plugin 子树创建临时局部 selector，且 job 结束前删除。
          SDK_VERSION="$(dotnet --list-sdks | awk '$1 ~ /^10\./ {version=$1} END {print version}')"
          test -n "$SDK_VERSION"
          trap 'rm -f "$GITHUB_WORKSPACE/hosts/revit/plugin/global.json"' EXIT
          printf '{\n  "sdk": {\n    "version": "%s",\n    "rollForward": "disable",\n    "allowPrerelease": false\n  }\n}\n' \
            "$SDK_VERSION" > "$GITHUB_WORKSPACE/hosts/revit/plugin/global.json"

          pushd "$GITHUB_WORKSPACE/hosts/revit/plugin/Revit.AgentHost.Core.Tests"
          dotnet --version
          dotnet test Revit.AgentHost.Core.Tests.csproj -f net10.0 -p:DspEnableNet10Compatibility=true
          popd
