name: M1 Task 7 Ruff verify

on:
  push:
    branches:
      - feat/technology-modernization-m1

jobs:
  absolute-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild locked verification environment
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Show Ruff import fix diff
        run: |
          .venv/bin/ruff check --select I --fix --diff \
            tests/architecture/test_modernization_runtime_matrix.py || true
