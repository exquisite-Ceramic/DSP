name: M1 Task 5 lock refresh

on:
  push:
    branches:
      - feat/technology-modernization-m1

# Task 5 的临时 lock writer：Ruff 纳入默认 dev group 后，由真实 uv resolver 更新 committed lock。
# 写回完成后必须删除；canonical CI 的长期入口仍只有 repository-regression.yml。
permissions:
  contents: write

jobs:
  refresh-lock:
    # bot 写回 uv.lock 后不再递归执行。
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/technology-modernization-m1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv resolver
        run: python -m pip install uv
      - name: Regenerate and validate lock
        run: |
          uv lock
          uv lock --check
      - name: Commit updated uv.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "build: lock canonical Python tooling"
          git push origin HEAD:feat/technology-modernization-m1
