name: Phase H Revit wall thickness

on:
  push:
    paths:
      - ".github/workflows/phase-h-revit-wall-thickness.yml"
      - "hosts/revit/**"
      - "tests/revit/**"
      - "tests/integration/test_phase_h_revit_wall_thickness_reconciliation.py"
      - "tests/integration/test_phase_h_revit_wall_thickness_live.py"
      - "providers/semantics/enterprise_mapping/**"
  pull_request:
    paths:
      - ".github/workflows/phase-h-revit-wall-thickness.yml"
      - "hosts/revit/**"
      - "tests/revit/**"
      - "tests/integration/test_phase_h_revit_wall_thickness_reconciliation.py"
      - "tests/integration/test_phase_h_revit_wall_thickness_live.py"
      - "providers/semantics/enterprise_mapping/**"
  workflow_dispatch:

jobs:
  phase-h-offline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: contracts/python:hosts/revit/sidecar/src:platform/semantic_runtime/src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Install Python verification dependencies
        # Ruff 版本与当前 committed uv.lock 一致，避免 focused gate 和 repository gate 使用不同规则集。
        run: >-
          python -m pip install
          pytest PyYAML==6.0.3 "jsonschema>=4.20" ruff==0.16.8
      # Task 4 收口要求 read-port focused tests 与 repository regression 在同一 exact HEAD 上取证。
      - name: Verify Revit architecture boundary
        run: python -m pytest tests/revit/test_revit_architecture.py -q -vv
      - name: Verify Revit sidecar adapter
        run: >-
          python -m pytest
          hosts/revit/sidecar/tests/test_model_adapter.py
          hosts/revit/sidecar/tests/test_execution_result_adapter.py
          hosts/revit/sidecar/tests/test_named_pipe.py
          hosts/revit/sidecar/tests/test_context.py
          hosts/revit/sidecar/tests/test_snapshot_read.py
          -q -vv
      - name: Verify Task 4 Revit read ports are Ruff clean
        run: >-
          ruff check --select E,F,I
          hosts/revit/sidecar/src/revit_sidecar/context.py
          hosts/revit/sidecar/src/revit_sidecar/snapshot_read.py
          hosts/revit/sidecar/tests/test_context.py
          hosts/revit/sidecar/tests/test_snapshot_read.py
      - name: Verify Revit design facts and enterprise mappings
        run: >-
          python -m pytest
          hosts/revit/sidecar/tests/test_design_fact_adapter.py
          tests/revit/test_revit_enterprise_mapping.py
          -q -vv
      - name: Verify Revit and AutoCAD reconciliation parity
        run: >-
          python -m pytest
          tests/integration/test_phase_h_revit_wall_thickness_reconciliation.py
          tests/integration/test_step34_autocad_wall_thickness_reconciliation.py
          -q -vv
      - name: Verify live Revit gate remains external-only
        env:
          DSP_REVIT_LIVE: "0"
        run: python -m pytest tests/integration/test_phase_h_revit_wall_thickness_live.py -q -vv
      - name: Verify Revit-free .NET core
        if: ${{ always() }}
        run: dotnet test hosts/revit/plugin/Revit.AgentHost.Core.Tests/Revit.AgentHost.Core.Tests.csproj
