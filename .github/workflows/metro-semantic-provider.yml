name: Metro semantic provider verification

permissions:
  contents: write

on:
  push:
    branches:
      - 'feat/metro-semantic-provider'
    paths:
      - 'providers/semantics/metro_v32/**'
      - 'tests/semantic_providers/metro_v32/**'
      - '.github/workflows/metro-semantic-provider.yml'
  workflow_dispatch:

jobs:
  metro-provider:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: providers/semantics/metro_v32/src:platform/semantic_service/src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: |
          python -m pip install pytest pytest-asyncio PyYAML==6.0.3
          python -m pip install -e platform/semantic_service -e platform/semantic_mcp -e providers/semantics/dsp_core -e providers/semantics/ifc43 -e providers/semantics/metro_v32
      - name: Inspect Metro catalog before golden freeze
        run: |
          python - <<'PY'
          from metro_semantic_provider.catalog import build_catalog
          from metro_semantic_provider.source import load_raw_machine_source
          c = build_catalog(load_raw_machine_source())
          print("content_hash", c.content_hash)
          print("terms", len(c.terms), "mappings", len(c.mappings), "rules", len(c.validation_rules), "decisions", len(c.decisions))
          print("pset_containers", len(c.source_coverage["chapter21_project_pset_containers"]))
          print("decision_states", sorted({item.state.value for item in c.decisions}))
          for term in (
              "metro:RunningRail",
              "metro:TunnelSegment.ConstructionMethod",
              "metro:BuildingElementDesign.DesignStatus",
              "metro:Mapping.RunningRail.ToIfcRail",
              "metro:Rule.ProhibitIfcTunnelEntity",
              "metro:Decision.DEC-05",
          ):
              print(term, dict(c.schema_for(term)))
          PY
      - name: Materialize reviewed Metro machine source
        if: ${{ hashFiles('providers/semantics/metro_v32/src/metro_semantic_provider/data/metro_v3_2.payload.part1') != '' }}
        run: |
          cat providers/semantics/metro_v32/src/metro_semantic_provider/data/metro_v3_2.payload.part1 providers/semantics/metro_v32/src/metro_semantic_provider/data/metro_v3_2.payload.part2 | base64 -d | gzip -d > /tmp/metro_v3_2.json
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          source = json.loads(Path('/tmp/metro_v3_2.json').read_text(encoding='utf-8'))
          assert len(source['source_coverage']['chapter21_project_pset_containers']) == 37
          assert source['source_coverage']['structured_property_rows'] == 236
          assert len(source['source_coverage']['inline_only_project_psets']) == 8
          assert len(source['decisions']) == 10
          assert {item['state'] for item in source['decisions']} == {'UNFROZEN'}
          ids = [item['term_id'] for item in source['terms']]
          assert len(ids) == len(set(ids))
          assert not any('PsetProj_' in item or '/' in item for item in ids)
          target = Path('providers/semantics/metro_v32/src/metro_semantic_provider/data/metro_v3_2.yaml')
          target.write_text(yaml.safe_dump(source, sort_keys=False, allow_unicode=True, width=120), encoding='utf-8')
          PY
          rm -f providers/semantics/metro_v32/src/metro_semantic_provider/data/metro_v3_2.payload.gz.b64
          rm providers/semantics/metro_v32/src/metro_semantic_provider/data/metro_v3_2.payload.part1 providers/semantics/metro_v32/src/metro_semantic_provider/data/metro_v3_2.payload.part2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A providers/semantics/metro_v32/src/metro_semantic_provider/data
          git commit -m 'feat(semantic): materialize reviewed Metro V3.2 source [skip ci]'
          git push origin HEAD:feat/metro-semantic-provider
      - name: Run Metro focused tests
        run: pytest -q tests/semantic_providers/metro_v32
