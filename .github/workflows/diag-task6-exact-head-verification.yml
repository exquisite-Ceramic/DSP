name: Diagnostic Task 6 exact-head verification

on:
  push:
    branches:
      - diag/task6-exact-head-verification-10cd6724
  workflow_dispatch:

jobs:
  task6-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 10cd6724f4e3f6311a45d832aff368776797be1a
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install repository verification stack
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Verify Task 6 exact focused tests
        run: >-
          uv run pytest
          tests/product_runtime/test_revit_execution_composition.py
          hosts/revit/sidecar/tests/test_execution.py
          hosts/revit/sidecar/tests/test_readiness.py
          -q -vv
      - name: Verify Task 6 product runtime Ruff
        run: >-
          uv run ruff check
          platform/product_runtime
          tests/product_runtime
