# Appendix B. Module Interaction Contracts

## B.1 通用责任规则

跨模块 contract SHALL 明确：

```text
Owner
Caller
Input
Output
Mode: sync | async/job | HITL
Retry owner
State owner
```

共同规则：

1. 一个长期状态只有一个 authoritative owner；
2. 跨请求恢复状态必须通过 typed id/ref 显式化；
3. child `deadline_at <= parent deadline_at`；
4. 只有理解幂等语义的直接调用方负责网络重试；
5. LLM 不负责 protocol retry、authorization retry 或 provider failover；
6. `PENDING` 必须返回 AsyncOperationRef；
7. retry/replan/compensation 由稳定 error code 驱动，不由自然语言 message 驱动。

## B.2 Interaction Matrix

| Caller | Callee | Input → Output | Mode | Retry owner | State owner |
|---|---|---|---|---|---|
| LangGraph | Host Context | context request → document/selection/view | sync | LangGraph(read-only) | Host |
| LangGraph | D5 Freshness Resolver | FreshnessContract → Snapshot | sync/job | freshness client | D5 |
| LangGraph | D4 Operation Resolver | ContextSnapshot → ResolvedOperation[] | sync | LangGraph | D4/Registry |
| D6/LangGraph | Interaction Coordinator | Interaction request → InteractionSession/AsyncOperationRef | async | stable idempotency owner | Interaction Coordinator |
| LangGraph | Impact Analyzer | BoundOperationProposal+PlanningSnapshot → Impact/Scope | sync/job | LangGraph | task runtime |
| LangGraph | ChangeSetBuilder | Proposal+SnapshotSet → immutable ChangeSet | sync | caller after deterministic correction | ChangeSet Store |
| LangGraph | Gateway | approval admission → ApprovalRecord | sync/HITL | LangGraph after approval | Gateway |
| LangGraph | Execution Planner | ChangeSet → Slice[]/Unit[] | sync | deterministic caller | Orchestrator/Execution Planner |
| LangGraph | Provider Resolver | ExecutionUnit → ProviderBinding | sync | Resolver for availability | Registry/Resolver |
| Gateway | Provider | Grant+Slice+Units+Bindings → execution result | sync/job | provider/gateway by idempotency | Provider execution |
| Provider/Sidecar | Host Plugin | HostCommand → Result/ActualDelta | IPC sync/async | Sidecar by idempotency | Host |
| LangGraph | Verify/Reconcile | ActualDelta → verified/scope result | sync/job | Orchestrator | D5/ChangeSet state |

## B.3 Operation Resolution

```text
LangGraph
  ↓ ContextSnapshot + task + policy
D4 Operation Resolver
  ↓ provider aggregation
  ↓ Host availability
  ↓ canonical semantic entity applicability
  ↓ Policy
  ↓ Task rank
  ↑ ResolvedOperation[] + structured-output schema
LLM
  ↑ OperationProposal
```

Provider-specific tool/schema MUST NOT 成为 LLM 必填 action field。

## B.4 Two-phase Freshness

```text
Phase A:
Host Context
  ↓
ContextFreshnessContract
  ↓
ContextSnapshot
  ↓
D4 / LLM / D6

Phase B:
BoundOperationProposal
  ↓ derive exact requirements
OperationFreshnessContract
  ↓
D5 selective reconstruction
  ↓
PlanningSnapshot
  ↓
SnapshotSet
  ↓
Impact / ChangeSetBuilder
```

Phase B 不得早于 material target/argument binding。

## B.5 Host Interaction

```text
D6 detects missing typed Host input
  ↓
interaction.start(idempotency_key)
  ↓
InteractionSession(PENDING) + AsyncOperationRef
  ↓
Host Canvas
  ↓ user result/cancel
Interaction Coordinator
  ↓ COMPLETED|CANCELLED
LangGraph resume
  ↓
D6 validates typed result
```

网络重试不得产生第二个 Host prompt。

## B.6 ChangeSet / Preview / Approval

```text
BoundOperationProposal + Planning SnapshotSet
  ↓
Impact Analyzer
  ↓ ChangeImpactGraph / propagation / ApprovalScopeBoundary
ChangeSetBuilder
  ↓ immutable ChangeSet + hash
Preview
  ↓
User/Policy approval
  ↓ ApprovalToken admission
Gateway
  ↓ persist ApprovalRecord
```

Preview 不得在渲染阶段偷偷新增 canonical operation/effect scope。

## B.7 Execution / Verify / Scope

```text
ApprovalRecord + immutable ChangeSet
  ↓
Execution Planner
  ↓ Slice[] → Unit[]
RevisionBarrier
  ↓
Provider Resolver
  ↓ ProviderBinding[] / binding_set_hash
Gateway
  ↓ ExecutionGrant
Provider/Sidecar
  ↓ HostCommand + stable idempotency_key
Host
  ↑ ActualDelta
D5 / Verify / Scope Comparator
```

结果分支：

| Condition | Required action |
|---|---|
| fail before commit | rollback native transaction; HOST_COMMAND_FAILED |
| commit + verify pass + scope inside | reconcile; Slice SUCCEEDED |
| commit + verify fail | VERIFY_FAILED → reconcile/compensating ChangeSet |
| ActualDelta outside approved scope | SCOPE_BREACH → stop remaining slices → compensate/reapproval |

