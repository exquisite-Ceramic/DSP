name: Refine DSP spec contract freeze

on:
  push:
    branches: [feat/semantic-runtime]
    paths:
      - .github/workflows/refine-spec-contract-freeze.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-runtime
          fetch-depth: 0
      - name: Apply and verify spec refinement
        run: python .github/scripts/refine_spec_contract.py
      - name: Commit refined spec and remove temporary files
        run: |
          rm -f .github/workflows/refine-spec-contract-freeze.yml
          rm -f .github/scripts/refine_spec_contract.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md .github/workflows/refine-spec-contract-freeze.yml .github/scripts/refine_spec_contract.py
          git diff --cached --check
          git commit -m 'docs: refine v0.6 contract freeze candidate'
          git push origin HEAD:feat/semantic-runtime
