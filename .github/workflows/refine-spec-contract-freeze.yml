## 9.5 Operation Resolver / Provider Resolver Pipeline

Operation Resolver SHALL 先聚合 provider catalog 为 canonical operation 视图，再执行：

```text
All provider capabilities
  ↓ aggregate by canonical_operation
Host availability filter
  ↓
Canonical semantic entity filter
  ↓
Policy filter
  ↓
Task rank / Top-K
  ↓
