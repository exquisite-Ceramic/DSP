# Appendix D. Numbered Contract Conformance

编号测试用于把 Spec 条款直接映射到 CI/Contract Test。实现 MAY 增加测试，但不得删除同义覆盖。

## D.1 Runtime / Execution — RC

| ID | Contract |
|---|---|
| RC-001 | Provider input/output schema 非法输入必须拒绝。 |
| RC-002 | 过期 Host revision/precondition 必须返回 `REVISION_CONFLICT`。 |
| RC-003 | 同逻辑副作用使用相同 idempotency_key、不同 request_id 重试不得产生重复副作用。 |
| RC-004 | Host transaction abort/crash 后不得残留 half commit。 |
| RC-005 | ActualDelta 必须包含 Host associativity 产生的隐式修改。 |
| RC-006 | verification contract 必须独立证明成功；Host `success=true` 不足以标记 verified。 |
| RC-007 | VIEW/CONTEXT capability 声明 model mutation effect 必须 conformance fail。 |
| RC-008 | Provider implementation 切换不得改变 ChangeSet/ExecutionUnit canonical semantics。 |
| RC-009 | binding_set_hash 变化必须使旧 ExecutionGrant 失效。 |
| RC-010 | CREATE inside creation_rule 通过；超出 kind/count/derivation 返回 `SCOPE_BREACH`。 |
| RC-011 | DELETE/implicit ActualDelta 超出 ApprovalScopeBoundary 返回 `SCOPE_BREACH` 并阻止后续 Slice。 |
| RC-012 | ApprovalToken consume 必须持久化 ApprovalRecord；后续 grant 引用 approval_id。 |
| RC-013 | `deadline_at` 为 absolute timestamp 且 child 不晚于 parent。 |
| RC-014 | `PENDING` 无 typed AsyncOperationRef 属于 contract failure。 |
| RC-015 | `interaction.start` 同 idempotency_key 重试不得创建第二 Host prompt。 |
| RC-016 | Cross-host 第二 Slice 失败进入 Saga/PARTIALLY_COMMITTED，不得继续未启动 slices。 |

## D.2 Progressive Semantic Runtime — SR

| ID | Contract |
|---|---|
| SR-001 | Context Freshness 默认不得读取 EXACT/NATIVE geometry。 |
| SR-002 | Operation Freshness 必须发生在 D6 material binding 之后。 |
| SR-003 | `UNRESOLVED != STALE`，Coverage/Maturity 与 Freshness 必须正交。 |
| SR-004 | 局部 reconstruction 不得声称整个 document fresh。 |
| SR-005 | `CLASSIFICATION` 具有独立 freshness/coverage。 |
| SR-006 | PlanningSnapshot 必须绑定 ProjectionRef + SemanticEnvironmentRef。 |
| SR-007 | SnapshotSet members 必须共享同一 pinned SemanticEnvironment。 |
| SR-008 | 任一 SnapshotSet member revision/snapshot/projection hash 或 environment 变化必须改变 set hash。 |
| SR-009 | Assurance requirement 不足必须 fail closed。 |
| SR-010 | Progressive reconstruction 只能升级 task-required aspect/depth/fidelity，不能无条件全量 IFC/Metro 重建。 |

## D.3 Semantic Provider — SP

| ID | Contract |
|---|---|
| SP-001 | Provider manifest 必须声明 id/type/version/content_hash/namespaces/capabilities/authority。 |
| SP-002 | 权威 namespace 不得被非权威 Provider 静默覆盖。 |
| SP-003 | term resolution / validation / mapping 在 pinned version 下必须 deterministic。 |
| SP-004 | semantic content 变化必须改变 content/environment hash；presentation-only 变化不应自动改变 semantic hash。 |
| SP-005 | Enterprise mapping provider 增删不得要求修改 D5 Core。 |
| SP-006 | `A-WALL-* → ifc:IfcWall` reference mapping 必须可由 Provider/config 实现。 |
| SP-007 | Semantic Provider unavailable 时按 pinned cache policy 降级或 fail closed，不得静默换语义版本。 |

## D.4 Metro Semantic — MS

| ID | Contract |
|---|---|
| MS-001 | Metro output 必须符合锁定的 IFC4X3_ADD2 Schema legality。 |
| MS-002 | official IFC Pset/Qto 与 `PsetProj_/QtoProj_` 必须区分。 |
| MS-003 | `IFC-M/IFC-O/P-M/P-C/P-R/PROHIBITED` 必须可映射为结构化 requirement。 |
| MS-004 | IDS requirement/单位/字段类型/映射 provenance 必须可验证。 |
| MS-005 | Metro Provider 不得重定义 `ifc:*` canonical meaning。 |

## D.5 Cross-host — CH

| ID | Contract |
|---|---|
| CH-001 | AutoCAD/Revit 同一对象可绑定同一 SemanticId、不同 HostBinding。 |
| CH-002 | 同一 wall thickness canonical operation 可生成不同 ProviderBinding，但 ExecutionUnit 保持相同 canonical semantics。 |
