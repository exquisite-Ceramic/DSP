# Appendix C. Reference Vertical Slices

## C.1 MOVE — Runtime / Execution / Governance Reference

MOVE 用来证明 **不依赖丰富领域语义也能完成完整治理执行链**。

```text
User selects entity/entities in AutoCAD
  ↓
CURRENT_SELECTION
  ↓
Context Freshness → ContextSnapshot CS-001
  ↓
D4 → MOVE ResolvedOperation
  ↓
LLM OperationProposal: move.v1 + displacement
  ↓
D6 target/argument binding
  ↓
Operation Freshness → PlanningSnapshot PS-001
  ↓ SnapshotSet PSS-001
Impact + ApprovalScopeBoundary
  ↓
ChangeSet CS-001
  ↓ Preview / ApprovalToken / ApprovalRecord
Execution Planner
  ↓ XS-CAD-01
  ↓ EU-001 (canonical move.v1)
RevisionBarrier
  ↓
Provider Resolver → PB-001
  ↓ binding_set_hash
Gateway → ExecutionGrant
  ↓
HostCommand → AutoCAD transaction
  ↓
ActualDelta
  ↓
Verify + Scope Check → D5 reconcile
```

验收目的：

- LLM 只看到 canonical MOVE；
- Phase A 不读 exact geometry；
- D6 在 Phase B 之前完成 material binding；
- ChangeSet/ExecutionUnit 不含 provider tool/native id；
- approval/grant/idempotency/revision/scope/verify 链完整。

## C.2 Wall Thickness — Semantic / Cross-host Reference

正文第 26 章“墙体加厚到 300mm”为第二条 reference vertical slice，额外证明：

```text
Progressive semantic reconstruction
Enterprise Mapping Provider
IFC4.3 canonical classification
Metro Semantic on demand
SemanticEnvironment pinning
SemanticIdentity cross-host binding
same canonical operation / different ProviderBinding
```

MOVE 与 Wall Thickness MUST 并存：前者验证 execution/governance baseline，后者验证 semantic/cross-host baseline。

