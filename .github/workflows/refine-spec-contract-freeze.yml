name: Refine DSP spec contract freeze

on:
  push:
    branches: [feat/semantic-runtime]
    paths: [.github/workflows/refine-spec-contract-freeze.yml]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-runtime
          fetch-depth: 0

      - name: Refine v0.6 spec contracts
        shell: bash
