name: Apply corrected DSP spec v0.6

on:
  push:
    branches:
      - feat/semantic-runtime
    paths:
      - .github/workflows/apply-corrected-spec-v06.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact corrected spec
        run: |
          cat .tmp/spec-v06/part* > /tmp/spec-v06.b64
          python - <<'PY'
          import base64, gzip
          encoded = open('/tmp/spec-v06.b64', 'rb').read()
          compressed = base64.b64decode(encoded)
          content = gzip.decompress(compressed)
          open('docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md', 'wb').write(content)
          PY
          actual="$(git hash-object docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md)"
          expected="00e9c8353dfd3fb2a9c3208c40933a8da4d517ca"
          echo "actual=$actual expected=$expected"
          test "$actual" = "$expected"

      - name: Commit corrected spec
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md
          if git diff --cached --quiet; then
            echo 'No spec changes to commit.'
            exit 0
          fi
          git commit -m 'docs: restore progressive runtime and governance contracts'
          git push
