name: Apply corrected DSP spec v0.6

on:
  push:
    branches:
      - feat/semantic-runtime
    paths:
      - .github/workflows/apply-corrected-spec-v06.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact spec patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, gzip, json, os, urllib.request
          url = 'https://api.github.com/repos/exquisite-Ceramic/DSP/git/blobs/c9576c999de6a3dfe426adb187aba2fb829be25d'
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req) as r:
              payload = json.load(r)
          compressed = base64.b64decode(payload['content'])
          patch = gzip.decompress(compressed)
          open('/tmp/spec-v06.patch', 'wb').write(patch)
          PY
          git apply /tmp/spec-v06.patch
          actual="$(git hash-object docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md)"
          expected="00e9c8353dfd3fb2a9c3208c40933a8da4d517ca"
          echo "actual=$actual expected=$expected"
          test "$actual" = "$expected"

      - name: Commit corrected spec
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/spec/Enterprise_Collaborative_Design_Agent_Spec_v0.6.md
          if git diff --cached --quiet; then
            echo 'No spec changes to commit.'
            exit 0
          fi
          git commit -m 'docs: restore progressive runtime and governance contracts'
          git push
