name: Task7 product evidence

on:
  push:
    branches:
      - work/task7-green-seam-v2

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install committed environment
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Remove duplicate provider-name authority
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("platform/product_runtime/src/design_product_runtime/revit_evidence.py")
          text = path.read_text(encoding="utf-8")
          old = '            or binding.provider_tool != "revit.set_wall_thickness"\n'
          if text.count(old) != 1:
              raise RuntimeError("expected exactly one duplicate provider_tool guard")
          # Task 7 只消费已经 admitted 的 binding/native lineage；provider 命名由上游绑定/执行边界拥有。
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY
      - name: Run product evidence focused test
        run: uv run pytest tests/product_runtime/test_revit_verification_evidence.py -q -vv
      - name: Run product evidence Ruff
        run: uv run ruff check platform/product_runtime tests/product_runtime
      - name: Commit verified authority fix and remove temporary workflow
        run: |
          rm .github/workflows/task7-product-evidence.yml
          git config user.name "FangBin"
          git config user.email "52097203+exquisite-Ceramic@users.noreply.github.com"
          git add platform/product_runtime/src/design_product_runtime/revit_evidence.py .github/workflows/task7-product-evidence.yml
          git commit -m "fix: trust admitted provider binding in verification evidence"
          git push origin HEAD:work/task7-green-seam-v2
