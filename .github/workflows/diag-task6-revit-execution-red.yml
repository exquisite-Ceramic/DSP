name: Diagnostic Task 6 Revit execution RED

on:
  push:
    branches:
      - diag/task6-product-execution-red
  workflow_dispatch:

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install repository verification stack
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Run Task 6 sidecar RED
        run: >-
          uv run pytest
          hosts/revit/sidecar/tests/test_execution.py
          hosts/revit/sidecar/tests/test_readiness.py
          -q -vv
