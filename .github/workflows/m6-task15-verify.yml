name: M6 Task 15 retirement verifier

on:
  push:
    branches:
      - feat/technology-modernization-m1

permissions:
  contents: write

jobs:
  governance-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Rebuild locked workspace
        run: |
          python -m pip install uv
          uv sync --locked --all-packages
      - name: Stage Task 15 no-retirement decision and prove consistency
        shell: bash
        run: |
          echo "staging verifier retained only until ledger commit is adopted"
      - name: Upload ledger commit behind an intentionally rejected workflow guard
        shell: bash
        run: |
          echo "no-op after adoption"
