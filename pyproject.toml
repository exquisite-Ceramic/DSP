[project]
name = "enterprise-design-agent"
version = "0.1.0"
description = "Enterprise collaborative design agent: host contracts, AutoCAD plugin & sidecar, platform runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.20",
]

# M1 只把 M0 已确认存在 package-local pyproject.toml 的第一方 distribution 纳入 workspace。
# 根项目本身天然是 workspace root，因此 members 只列子项目；不得把仅靠 pytest pythonpath
# 暴露的 platform/approval_scope、impact、interaction、orchestrator 当作正式 package 加入。
[tool.uv.workspace]
members = [
    "contracts/python",
    "hosts/autocad/sidecar",
    "hosts/revit/sidecar",
    "platform/changeset",
    "platform/convergence",
    "platform/execution_coordination",
    "platform/execution_planning",
    "platform/execution_reconciliation",
    "platform/gateway_authorization",
    "platform/materialization_planning",
    "platform/materialization_topology",
    "platform/provider_binding",
    "platform/semantic_mcp",
    "platform/semantic_runtime",
    "platform/semantic_service",
    "providers/semantics/dsp_core",
    "providers/semantics/enterprise_mapping",
    "providers/semantics/ifc43",
    "providers/semantics/metro_v32",
]

[tool.pytest.ini_options]
testpaths = ["tests", "contracts/python/tests"]
pythonpath = [
    # 统一仓库根目录、本地测试与 CI 的 Python 模块解析边界。
    # 从仓库根目录执行离线回归时不需要额外手工拼接 PYTHONPATH。
    "contracts/python",
    "hosts/autocad/sidecar/src",
    "hosts/revit/sidecar/src",
    "platform/orchestrator/src",
    "platform/interaction/src",
    "platform/impact/src",
    "platform/approval_scope/src",
    "platform/changeset/src",
    "platform/materialization_topology/src",
    "platform/materialization_planning/src",
    "platform/execution_planning/src",
    "platform/execution_coordination/src",
    "platform/provider_binding/src",
    "platform/gateway_authorization/src",
    "platform/execution_reconciliation/src",
    "platform/convergence/src",
    "platform/semantic_runtime/src",
    "platform/semantic_service/src",
    "tests/integration",
    "tests/provider_binding",
    "tests/gateway_authorization",
    "tests/execution_reconciliation",
]
addopts = "-ra --strict-markers"
markers = [
    "integration: 需要真实宿主（AutoCAD 和/或 Revit）的测试",
    "conformance: 契约一致性测试",
    "asyncio: 异步测试标记 (pytest-asyncio)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
