[project]
name = "autocad-sidecar"
version = "0.1.0"
description = "Python sidecar process for the AutoCAD agent host: command orchestration, retry, idempotency, health."
requires-python = ">=3.11"
# host-contracts is the Python mirror of contracts/ (pip install -e contracts/python)
dependencies = [
    "host-contracts>=0.1.0",
]

[project.optional-dependencies]
pipe = ["pywin32>=306"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../../../tests"]
