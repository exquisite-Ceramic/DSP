[project]
name = "autocad-sidecar"
version = "0.1.0"
description = "Python sidecar process for the AutoCAD agent host: command orchestration, retry, idempotency, health."
requires-python = ">=3.11"
# host-contracts distribution 同时发布 host_contracts 与 Step 19 薄适配器使用的
# frozen design_fact_contracts package。
dependencies = [
    "host-contracts>=0.1.0",
    "grpcio>=1.70,<2",
    "protobuf>=5.29,<7",
    "mcp>=2,<3",
]

# M1 将已声明的第一方依赖显式绑定到 workspace member，避免依赖 editable-install 顺序。
[tool.uv.sources]
host-contracts = { workspace = true }

[project.scripts]
autocad-sidecar-mcp = "autocad_sidecar.mcp_main:main"

[project.optional-dependencies]
pipe = ["pywin32>=306"]
grpc-build = ["grpcio-tools==1.70.0"]

# M4 Task 12：canonical proto 仍是唯一 source-of-truth；生成器由 grpc-build exact pin +
# committed uv.lock 固定。命令以 sidecar 目录为工作目录，并直接指向现有 generated package。
[tool.dsp.proto-codegen]
source = "../../../../contracts/proto/host_transport_v1.proto"
output = "src/autocad_sidecar/ipc/generated"
command = "python -m grpc_tools.protoc -I ../../../../contracts/proto --python_out=src/autocad_sidecar/ipc/generated --grpc_python_out=src/autocad_sidecar/ipc/generated ../../../../contracts/proto/host_transport_v1.proto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../../../tests"]
