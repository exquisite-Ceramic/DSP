[project]
name = "autocad-sidecar"
version = "0.1.0"
description = "Python sidecar process for the AutoCAD agent host: command orchestration, retry, idempotency, health."
requires-python = ">=3.11"
# host-contracts is the Python mirror of contracts/ (repository pythonpath in development).
dependencies = [
    "host-contracts>=0.1.0",
    "grpcio>=1.70,<2",
    "protobuf>=5.29,<7",
]

[project.optional-dependencies]
pipe = ["pywin32>=306"]
grpc-build = ["grpcio-tools==1.70.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../../../tests"]
